<script>
        // Configuration with your project credentials
        const SUPABASE_URL = 'https://pueffzvcnonfyjftloto.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_IMUxKFnuQIQP2XmfXhc6zQ_HVYZSKZS';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Safely capture optional referral query parameter without extension interference
        let referredBy = null;
        try {
            const urlParams = new URLSearchParams(window.location.search);
            referredBy = urlParams.get('ref');
        } catch (err) {
            console.log('Query param parse note:', err);
        }

        document.getElementById('buyerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('buyerError');
            const successDiv = document.getElementById('buyerSuccess');
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const fileInput = document.getElementById('nationalIdFile').files[0];

            // Collect selected category checkboxes
            const selectedCategories = Array.from(document.querySelectorAll('input[name="category"]:checked'))
                .map(cb => cb.value);

            if (selectedCategories.length === 0) {
                errorDiv.textContent = 'Please select at least one category of interest.';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                // 1. Upload National ID file to Supabase Storage bucket 'national-ids'
                const fileExt = fileInput.name.split('.').pop();
                const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
                const filePath = `ids/${fileName}`;

                const { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from('national-ids')
                    .upload(filePath, fileInput);

                if (uploadError) throw uploadError;

                // File path reference for database storage
                const nationalIdUrl = filePath;

                // 2. Insert buyer record into database
                const { error: dbError } = await supabaseClient
                    .from('buyers')
                    .insert([{
                        full_name: fullName,
                        email: email,
                        whatsapp_number: whatsapp || null,
                        national_id_url: nationalIdUrl,
                        categories_interest: selectedCategories,
                        referred_by: referredBy
                    }]);

                if (dbError) throw dbError;

                successDiv.textContent = 'Registration successful! Awaiting admin approval for access.';
                successDiv.style.display = 'block';
                document.getElementById('buyerForm').reset();

            } catch (err) {
                console.error(err);
                errorDiv.textContent = 'Error during registration: ' + err.message;
                errorDiv.style.display = 'block';
            }
        });
    </script>

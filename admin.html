<!-- TAB 2: INQUIRIES (Grouped & Collapsible Cards) -->
<div id="section-inquiries" class="max-w-6xl mx-auto hub-card p-4 md:p-6 hidden">
    <div class="flex justify-between items-center mb-4 border-b pb-3">
        <h2 class="text-lg md:text-xl font-bold text-[#1e5aa8]">Product Inquiries & Feedback</h2>
        <span id="inquiry-count" class="text-xs bg-blue-100 text-[#1e5aa8] px-3 py-1 rounded-full font-semibold">0 inquiries</span>
    </div>
    
    <div id="inquiries-container" class="space-y-4">
        <div class="p-4 text-center text-gray-500">Loading inquiries...</div>
    </div>
</div>

<script>
    // --- TAB 2: INQUIRIES (Grouped by Buyer -> Product, Collapsible Card Layout) ---
    async function loadInquiriesPortal() {
        const container = document.getElementById('inquiries-container');
        if (!container) return;

        const { data, error } = await db
            .from('inquiries')
            .select('*, buyers:buyer_id(full_name, email)')
            .order('created_at', { ascending: false });

        if (error) {
            container.innerHTML = `<div class="p-4 text-center text-red-500">Error: ${escapeHtml(error.message)}</div>`;
            return;
        }
        if (!data || data.length === 0) {
            container.innerHTML = `<div class="p-4 text-center text-gray-500">No product inquiries found.</div>`;
            document.getElementById('inquiry-count').textContent = '0 inquiries';
            return;
        }

        document.getElementById('inquiry-count').textContent = `${data.length} inquiry${data.length === 1 ? '' : 's'}`;

        // Group inquiries by Buyer ID, then by Product ID
        const grouped = {};
        data.forEach(inq => {
            const buyerId = inq.buyer_id || 'unknown';
            if (!grouped[buyerId]) {
                grouped[buyerId] = {
                    buyerName: inq.buyers?.full_name || 'Unknown Buyer',
                    buyerEmail: inq.buyers?.email || 'No email',
                    products: {}
                };
            }
            const prodId = inq.product_id || 'general';
            if (!grouped[buyerId].products[prodId]) {
                grouped[buyerId].products[prodId] = [];
            }
            grouped[buyerId].products[prodId].push(inq);
        });

        // Render compact, collapsible cards
        let html = '';
        for (const [buyerId, buyerData] of Object.entries(grouped)) {
            html += `
                <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-4 mb-3">
                    <div class="flex justify-between items-center border-b pb-2 mb-3">
                        <div>
                            <span class="font-bold text-gray-800 text-sm">${escapeHtml(buyerData.buyerName)}</span>
                            <span class="text-xs text-gray-400 ml-2">(${escapeHtml(buyerData.buyerEmail)})</span>
                        </div>
                        <span class="text-[11px] bg-gray-100 text-gray-600 px-2 py-0.5 rounded font-medium">Buyer Inquiries</span>
                    </div>
                    <div class="space-y-3 pl-2">
            `;

            for (const [prodId, inquiriesList] of Object.entries(buyerData.products)) {
                html += `
                    <div class="bg-gray-50 border border-gray-100 rounded p-3">
                        <div class="flex justify-between items-center text-xs font-semibold text-gray-700 mb-2">
                            <span>Product ID: <span class="font-mono text-[#1e5aa8]">${escapeHtml(prodId)}</span></span>
                            <span class="text-gray-400 text-[11px]">${inquiriesList.length} message(s)</span>
                        </div>
                        <div class="space-y-2">
                `;

                inquiriesList.forEach((inq, idx) => {
                    const status = (inq.status || 'pending_verification').toLowerCase();
                    let badge = `<span class="bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded text-[10px] font-semibold">PENDING</span>`;
                    let actionBtn = `<button onclick="verifyInquiry('${inq.id}')" class="bg-blue-600 text-white hover:bg-blue-700 px-2 py-0.5 rounded text-[11px] font-semibold transition">Verify & Commission</button>`;

                    if (status === 'verified') {
                        badge = `<span class="bg-green-100 text-green-700 px-1.5 py-0.5 rounded text-[10px] font-semibold">VERIFIED</span>`;
                        actionBtn = `<span class="text-[11px] text-gray-400 font-medium">Done</span>`;
                    }

                    const uniqueId = `msg-${inq.id}`;
                    const fullMsg = escapeHtml(inq.message || 'No message provided');
                    const isLong = fullMsg.length > 100;

                    html += `
                        <div class="bg-white border border-gray-200 rounded p-2 text-xs flex flex-col gap-1.5">
                            <div class="flex justify-between items-start gap-2">
                                <div class="text-gray-700 flex-1">
                                    <div id="${uniqueId}-preview" class="${isLong ? 'line-clamp-2' : ''} text-gray-600">${fullMsg}</div>
                                    ${isLong ? `<button onclick="document.getElementById('${uniqueId}-preview').classList.toggle('line-clamp-2'); this.textContent = this.textContent === 'Show more' ? 'Show less' : 'Show more';" class="text-[10px] text-[#1e5aa8] underline mt-0.5 font-semibold">Show more</button>` : ''}
                                </div>
                                <div class="flex items-center gap-2 shrink-0">
                                    ${badge}
                                    ${actionBtn}
                                </div>
                            </div>
                            <div class="text-[10px] text-gray-400 font-mono">Vendor: ${escapeHtml(inq.vendor_id)} | Sent: ${new Date(inq.created_at).toLocaleDateString()}</div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            }

            html += `</div></div>`;
        }

        container.innerHTML = html;
    }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Register</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        body { 
            background: linear-gradient(135deg, #f5f7fa 0%, #e8f0f8 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2c3e50; 
            padding: 20px;
        }
        .register-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(30, 90, 168, 0.08);
            width: 100%;
            max-width: 480px;
            border: 2px solid #e1e8ed;
        }
        h2 { color: #1e5aa8; margin-bottom: 8px; font-size: 24px; }
        p.subtitle { color: #718096; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; font-size: 14px; color: #2c3e50; margin-bottom: 6px; }
        input { width: 100%; padding: 12px 14px; border: 2px solid #e1e8ed; border-radius: 8px; font-size: 14px; color: #2c3e50; background: #f8fbff; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #1e5aa8; }
        .btn-submit { background: linear-gradient(135deg, #1e5aa8 0%, #2e7bb4 100%); color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; transition: opacity 0.2s; }
        .btn-submit:hover { opacity: 0.9; }
        .alert { padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; display: none; }
        .alert-error { background: #fff5f5; color: #e53e3e; border: 1px solid #fed7d7; }
        .alert-success { background: #f0fff4; color: #38a169; border: 1px solid #c6f6d5; }
        .footer-text { text-align: center; font-size: 14px; color: #718096; margin-top: 20px; }
        .footer-text a { color: #1e5aa8; text-decoration: none; font-weight: 600; }
        .footer-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="register-card">
        <h2>Create Account</h2>
        <p class="subtitle">Join the Echo Hub marketplace ecosystem.</p>

        <div id="alert-box" class="alert"></div>

        <form id="register-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <div class="form-group" id="ref-display-group" style="display:none;">
                <label for="ref-code">Referral Code Applied</label>
                <input type="text" id="ref-code" readonly style="background: #edf2f7; color: #4a5568;">
            </div>
            <button type="submit" class="btn-submit" id="submit-btn">Create Account</button>
        </form>

        <div class="footer-text">
            Already have an account? <a href="login.html">Sign In</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nvtqtkllmsiqknogmarc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ju4wLLra1DBXDyGiHGOB7w_TdsjcBj1';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let capturedRefCode = null;

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const refParam = urlParams.get('ref');
            
            if (refParam) {
                capturedRefCode = refParam.trim().toUpperCase();
                document.getElementById('ref-code').value = capturedRefCode;
                document.getElementById('ref-display-group').style.display = 'block';
                console.log("Captured referral code from URL:", capturedRefCode);
            }
        });

        function showAlert(message, type) {
            const box = document.getElementById('alert-box');
            box.textContent = message;
            box.className = `alert alert-${type}`;
            box.style.display = 'block';
        }

        async function handleRegister(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submit-btn');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';

            // 1. Sign up user with Supabase Auth
            const { data: authData, error: authError } = await db.auth.signUp({
                email,
                password
            });

            if (authError) {
                showAlert(authError.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
                return;
            }

            const user = authData.user;
            if (!user) {
                showAlert('Registration failed. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
                return;
            }

            // 2. Database trigger automatically creates user_profiles row on auth signup

            // 3. Handle Referral Tracking attribution if a valid ?ref=CODE parameter was captured
            if (capturedRefCode) {
                console.log("Processing referral linkage for referrer code:", capturedRefCode);

                // Find the referrer's user ID from user_profiles using their referral code
                const { data: referrerProfile, error: refLookupErr } = await db
                    .from('user_profiles')
                    .select('id')
                    .eq('referral_code', capturedRefCode)
                    .maybeSingle();

                if (!refLookupErr && referrerProfile && referrerProfile.id !== user.id) {
                    // Write record to the referrals tracking table
                    const { error: refInsertErr } = await db
                        .from('referrals')
                        .insert([{
                            referrer_id: referrerProfile.id,
                            referred_id: user.id,
                            status: 'active'
                        }]);

                    if (refInsertErr) {
                        console.error('Failed to record referral linkage:', refInsertErr.message);
                    } else {
                        console.log('Successfully recorded referral relationship!', { referrer: referrerProfile.id, referred: user.id });
                    }
                } else {
                    console.warn('Invalid or self-referral code ignored:', capturedRefCode);
                }
            }

            showAlert('Account created successfully! Redirecting to marketplace...', 'success');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }
    </script>
</body>
</html>

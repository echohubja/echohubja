<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Login</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8f0f8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #2c3e50;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(30, 90, 168, 0.08);
            overflow: hidden;
            padding: 40px;
        }

        h2 {
            color: #1e5aa8;
            font-size: 1.8em;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.95em;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85em;
            font-weight: 600;
            color: #475569;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            color: #1e293b;
            background: #fff;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #1e5aa8;
            background: #f8fafc;
        }

        .btn-submit {
            width: 100%;
            background: #1e5aa8;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #174887;
        }

        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .alert-msg {
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 0.85em;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #dcfce7;
            color: #15803d;
        }

        .alert-error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .alert-warning {
            background: #fef3c7;
            color: #d97706;
        }

        .account-type-selection {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .account-type-btn {
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.2s;
            text-align: center;
        }

        .account-type-btn:hover {
            border-color: #1e5aa8;
            background: #f8fafc;
        }

        .account-type-btn.active {
            background: #1e5aa8;
            color: white;
            border-color: #1e5aa8;
        }

        .register-links {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85em;
            color: #64748b;
            line-height: 1.8;
        }

        .register-links a {
            color: #1e5aa8;
            text-decoration: none;
            font-weight: 600;
        }

        .register-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div id="formHeader">
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to your Echo Hub account</p>
        </div>

        <div id="authAlert" class="alert-msg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="your@email.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
        </form>

        <div class="register-links">
            Don't have an account? <a href="register.html">Register as Buyer</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nvtqtkllmsiqknogmarc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ju4wLLra1DBXDyGiHGOB7w_TdsjcBj1';
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const authAlert = document.getElementById('authAlert');

        // Web Crypto API password verification using PBKDF2
        async function verifyPassword(password, storedHash) {
            try {
                // Decode the stored hash (salt + hash combined in base64)
                const combined = Uint8Array.from(atob(storedHash), c => c.charCodeAt(0));
                const salt = combined.slice(0, 16);
                const hashToCompare = combined.slice(16);

                // Hash the provided password with the same salt
                const encoder = new TextEncoder();
                const data = encoder.encode(password);

                const key = await crypto.subtle.importKey(
                    'raw',
                    data,
                    'PBKDF2',
                    false,
                    ['deriveBits']
                );

                const bits = await crypto.subtle.deriveBits(
                    {
                        name: 'PBKDF2',
                        salt: salt,
                        iterations: 100000,
                        hash: 'SHA-256'
                    },
                    key,
                    256
                );

                const computedHash = new Uint8Array(bits);

                // Constant-time comparison to prevent timing attacks
                let match = true;
                for (let i = 0; i < hashToCompare.length; i++) {
                    if (hashToCompare[i] !== computedHash[i]) {
                        match = false;
                    }
                }

                return match;
            } catch (err) {
                console.error('[PASSWORD_VERIFY_ERROR]', err);
                return false;
            }
        }

        // Handle Login Form Submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            showAlert('', false);
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                if (!supabaseClient) throw new Error('Supabase client failed to initialize.');

                // AUTO-DETECT: Try vendor first, then buyer
                console.log('[LOGIN] Auto-detecting user type for email:', email);

                // Try vendor
                const { data: vendorData, error: vendorError } = await supabaseClient
                    .from('vendors')
                    .select('*')
                    .eq('email', email)
                    .single();

                if (!vendorError && vendorData) {
                    // VENDOR LOGIN
                    console.log('[VENDOR_LOGIN] Found vendor, verifying password');
                    const passwordMatch = await verifyPassword(password, vendorData.password);

                    if (!passwordMatch) {
                        throw new Error('Invalid email or password.');
                    }

                    // Store vendor session
                    console.log('[VENDOR_LOGIN] Login successful, storing session');
                    localStorage.setItem('vendor_id', vendorData.id);
                    localStorage.setItem('vendor_email', vendorData.email);
                    localStorage.setItem('vendor_is_blocked', vendorData.is_blocked);
                    localStorage.setItem('vendor_session', JSON.stringify(vendorData));

                    // Check if vendor is flagged
                    console.log('[VENDOR_LOGIN] Checking flag status');
                    const { data: vendorFlag } = await supabaseClient
                        .rpc('check_user_flagged_status', {
                            p_vendor_id: vendorData.id,
                            p_buyer_id: null
                        })
                        .single();

                    if (vendorFlag && vendorFlag.is_flagged) {
                        console.log('[VENDOR_LOGIN] Vendor is flagged, redirecting to restricted portal');
                        showAlert('Account restricted. Redirecting to restricted portal...', false);
                        setTimeout(() => {
                            window.location.href = 'restricted-portal.html';
                        }, 1000);
                    } else if (vendorData.is_blocked) {
                        showAlert('⚠️ Your account is currently blocked. Update your commission to activate.', 'warning');
                        setTimeout(() => {
                            window.location.href = 'manage.html';
                        }, 1500);
                    } else {
                        showAlert('Login successful! Redirecting to dashboard...', false);
                        setTimeout(() => {
                            window.location.href = 'manage.html';
                        }, 1000);
                    }
                } else {
                    // Try buyer
                    console.log('[LOGIN] Vendor not found, checking buyers table');
                    const { data: buyerData, error: buyerError } = await supabaseClient
                        .from('buyers')
                        .select('*')
                        .eq('email', email)
                        .single();

                    if (buyerError || !buyerData) {
                        throw new Error('Account not found. Please register first.');
                    }

                    // BUYER LOGIN
                    console.log('[BUYER_LOGIN] Found buyer, verifying password');
                    const passwordMatch = await verifyPassword(password, buyerData.password);

                    if (!passwordMatch) {
                        throw new Error('Invalid email or password.');
                    }

                    // Check approval status (case-insensitive)
                    if (buyerData.approval_status?.toUpperCase() !== 'APPROVED') {
                        throw new Error('Your account is pending approval. Please check your email for updates.');
                    }

                    // Store buyer session
                    console.log('[BUYER_LOGIN] Login successful, storing session');
                    localStorage.setItem('buyer_id', buyerData.id);
                    localStorage.setItem('buyer_email', buyerData.email);
                    localStorage.setItem('buyer_referral_code', buyerData.referral_code);
                    localStorage.setItem('buyer_session', JSON.stringify(buyerData));

                    // Check if buyer is flagged
                    console.log('[BUYER_LOGIN] Checking flag status');
                    const { data: buyerFlag } = await supabaseClient
                        .rpc('check_user_flagged_status', {
                            p_vendor_id: null,
                            p_buyer_id: buyerData.id
                        })
                        .single();

                    if (buyerFlag && buyerFlag.is_flagged) {
                        console.log('[BUYER_LOGIN] Buyer is flagged, redirecting to restricted portal');
                        showAlert('Account restricted. Redirecting to restricted portal...', false);
                        setTimeout(() => {
                            window.location.href = 'restricted-portal.html';
                        }, 1000);
                    } else {
                        showAlert('Login successful! Redirecting to marketplace...', false);
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1000);
                    }
                }

            } catch (err) {
                console.error('[LOGIN_ERROR]', err);
                showAlert(err.message, true);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });

        function showAlert(msg, isError) {
            if (!msg) {
                authAlert.style.display = 'none';
                return;
            }
            authAlert.textContent = msg;
            if (isError === true) {
                authAlert.className = 'alert-msg alert-error';
            } else if (isError === 'warning') {
                authAlert.className = 'alert-msg alert-warning';
            } else {
                authAlert.className = 'alert-msg alert-success';
            }
            authAlert.style.display = 'block';
        }
    </script>
</body>
</html>

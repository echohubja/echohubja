<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Marketplace & Product Inquiries</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #f5f7fa 0%, #e8f0f8 100%) !important;
            background-attachment: fixed !important;
            min-height: 100vh;
            color: #2c3e50; 
        }
        header {
            background: linear-gradient(135deg, #1e5aa8 0%, #2e7bb4 100%) !important;
            color: white !important;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(30, 90, 168, 0.1);
            margin-bottom: 30px;
        }
        header h1 { font-size: 2.2em; margin-bottom: 5px; font-weight: 700; color: white !important; }
        header p { font-size: 1.05em; opacity: 0.95; margin: 0; color: white !important; }
        .hub-card {
            background: #ffffff !important;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(30, 90, 168, 0.05);
        }
    </style>
</head>
<body class="p-6">

    <header>
        <h1>Echo Hub Marketplace</h1>
        <p>Explore Products & Submit Inquiries</p>
    </header>

    <div class="max-w-4xl mx-auto hub-card p-6 mb-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-[#1e5aa8]">Featured Products</h2>
            <div id="buyer-session-badge" class="text-xs bg-gray-100 text-gray-700 px-3 py-1 rounded-full font-medium">
                Active Buyer: <span id="current-buyer-name" class="font-bold text-[#1e5aa8]">Loading...</span>
            </div>
        </div>

        <div id="product-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Dynamically populated from Supabase products table -->
            <div class="p-4 border border-gray-200 rounded-lg flex items-center justify-center text-gray-500">
                Loading products from database...
            </div>
        </div>
    </div>

    <!-- Inquiry Modal -->
    <div id="inquiry-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl relative">
            <h3 id="modal-product-title" class="text-lg font-bold text-[#1e5aa8] mb-1">Inquire About Product</h3>
            <p class="text-xs text-gray-500 mb-4">Send a message to the vendor regarding this item.</p>
            
            <form id="inquiry-form" onsubmit="submitInquiry(event)">
                <input type="hidden" id="modal-product-id">
                
                <!-- Grid layout for Buyer ID & Vendor ID UI cards -->
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div class="bg-gray-50 p-2.5 rounded-lg border border-gray-200">
                        <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-0.5">Buyer ID</label>
                        <div id="modal-buyer-display" class="text-xs font-semibold text-gray-800 truncate">Loading...</div>
                    </div>
                    <div class="bg-gray-50 p-2.5 rounded-lg border border-gray-200">
                        <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-0.5">Vendor ID</label>
                        <div id="modal-vendor-display" class="text-xs font-semibold text-gray-800 truncate">Loading...</div>
                        <input type="hidden" id="modal-vendor-id">
                    </div>
                </div>

                <!-- Message Box for Custom Inquiry Text -->
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Your Message / Inquiry Details</label>
                    <textarea id="modal-message" rows="3" required placeholder="Type your inquiry or question about this product here..." class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-[#1e5aa8] focus:outline-none"></textarea>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeInquiryModal()" class="bg-gray-100 text-gray-600 hover:bg-gray-200 px-4 py-2 rounded-lg text-sm font-semibold transition">Cancel</button>
                    <button type="submit" id="submit-btn" class="bg-[#1e5aa8] text-white hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-semibold transition">Send Inquiry</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let db;
        let activeBuyer = null;
        const SUPABASE_URL = 'https://pueffzvcnonfyjftloto.supabase.co';

        window.addEventListener('DOMContentLoaded', async () => {
            if (window.supabase) {
                const SUPABASE_ANON_KEY = 'sb_publishable_IMUxKFnuQIQP2XmfXhc6zQ_HVYZSKZS';
                db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                await identifyBuyerSession();
                await loadProducts();
            } else {
                console.error("Supabase library failed to load.");
            }
        });

        async function identifyBuyerSession() {
            try {
                const { data, error } = await db.from('buyers').select('*').limit(1).single();
                if (error || !data) {
                    document.getElementById('current-buyer-name').textContent = 'Guest User';
                    return;
                }
                activeBuyer = data;
                document.getElementById('current-buyer-name').textContent = data.full_name;
            } catch (err) {
                console.error("Error identifying buyer session:", err);
                document.getElementById('current-buyer-name').textContent = 'Session Error';
            }
        }

        async function loadProducts() {
            try {
                const { data: products, error } = await db.from('products').select('*');
                const productListContainer = document.getElementById('product-list');
                
                if (error || !products || products.length === 0) {
                    productListContainer.innerHTML = '<div class="col-span-2 p-4 text-center text-gray-500">No products found in database.</div>';
                    return;
                }

                productListContainer.innerHTML = '';
                products.forEach(product => {
                    // Safely extract properties accommodating variable column naming
                    const pId = product.id;
                    const pTitle = product.title || product.name || 'Unnamed Product';
                    const pDesc = product.description || 'High-quality marketplace product.';
                    const pPrice = product.price ? parseFloat(product.price).toFixed(2) : '0.00';
                    const pVendorId = product.vendor_id || product.vendorId || 'Unassigned';

                    const card = document.createElement('div');
                    card.className = 'p-4 border border-gray-200 rounded-lg flex flex-col justify-between';
                    card.innerHTML = `
                        <div>
                            <span class="text-xs bg-blue-100 text-[#1e5aa8] px-2.5 py-1 rounded-full font-semibold">Verified Item</span>
                            <h3 class="text-lg font-bold text-gray-800 mt-2">${escapeHtml(pTitle)}</h3>
                            <p class="text-gray-600 text-sm mt-1">${escapeHtml(pDesc)}</p>
                            <div class="text-xl font-extrabold text-[#1e5aa8] mt-3">$${pPrice} USD</div>
                        </div>
                        <button onclick="openInquiryModal('${pId}', '${escapeHtml(pTitle).replace(/'/g, "\\'")}', ${pPrice}, '${pVendorId}')" class="mt-4 bg-[#1e5aa8] text-white hover:bg-blue-700 py-2 px-4 rounded-lg text-sm font-semibold transition">
                            Inquire Now
                        </button>
                    `;
                    productListContainer.appendChild(card);
                });
            } catch (err) {
                console.error("Error loading products:", err);
                document.getElementById('product-list').innerHTML = '<div class="col-span-2 p-4 text-center text-red-500">Error loading product catalog.</div>';
            }
        }

        function openInquiryModal(productId, productTitle, price, vendorId) {
            if (!activeBuyer) {
                alert('Unable to proceed: No active buyer profile detected.');
                return;
            }

            document.getElementById('modal-product-id').value = productId;
            document.getElementById('modal-vendor-id').value = vendorId;
            document.getElementById('modal-product-title').textContent = `Inquire: ${productTitle} ($${price})`;
            
            // Clean display values showing user name and dynamic vendor ID from database
            document.getElementById('modal-buyer-display').textContent = activeBuyer.full_name;
            document.getElementById('modal-vendor-display').textContent = vendorId;
            
            document.getElementById('inquiry-modal').classList.remove('hidden');
        }

        function closeInquiryModal() {
            document.getElementById('inquiry-modal').classList.add('hidden');
            document.getElementById('inquiry-form').reset();
        }

        async function submitInquiry(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            const productId = document.getElementById('modal-product-id').value;
            const vendorId = document.getElementById('modal-vendor-id').value;
            const buyerId = activeBuyer.id;
            const messageText = document.getElementById('modal-message').value.trim();

            try {
                const { error } = await db
                    .from('inquiries')
                    .insert([
                        {
                            product_id: isNaN(productId) ? productId : parseInt(productId, 10),
                            vendor_id: vendorId,
                            buyer_id: buyerId,
                            message: messageText,
                            status: 'pending_verification'
                        }
                    ]);

                if (error) throw error;

                alert('Inquiry sent successfully!');
                closeInquiryModal();
            } catch (err) {
                alert('Error submitting inquiry: ' + err.message);
                console.error(err);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Inquiry';
            }
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>

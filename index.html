<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Admin & Vendor Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        body { 
            background: linear-gradient(135deg, #f5f7fa 0%, #e8f0f8 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #2c3e50; 
        }
        header {
            background: linear-gradient(135deg, #1e5aa8 0%, #2e7bb4 100%);
            color: white;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(30, 90, 168, 0.1);
        }
        .header-left h1 { font-size: 2.2em; margin-bottom: 5px; }
        .header-left p { font-size: 1.05em; opacity: 0.95; margin: 0; }
        .layout { max-width: 1400px; margin: 40px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 25px; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(30, 90, 168, 0.05);
            border: 1px solid #e1e8ed;
        }
        .card h3 { color: #1e5aa8; margin-bottom: 20px; font-size: 18px; text-transform: uppercase; letter-spacing: 0.5px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; color: #4a5568; font-weight: 700; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
        .btn-verify {
            background: #2b6cb0;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .btn-verify:hover { background: #2c5282; }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <h1>Echo Hub</h1>
            <p>Admin & Vendor Verification Dashboard</p>
        </div>
    </header>

    <div class="layout">
        <div class="card">
            <h3>Pending Product Inquiries & Feedback</h3>
            <table>
                <thead>
                    <tr>
                        <th>Inquiry ID</th>
                        <th>Buyer (e.g., Tria Sly)</th>
                        <th>Product</th>
                        <th>Vendor ID</th>
                        <th>Message</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="inquiries-table-body">
                    <!-- Dynamic rows load here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pueffzvcnonfyjftloto.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_IMUxKFnuQIQP2XmfXhc6zQ_HVYZSKZS';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadInquiries() {
            const tbody = document.getElementById('inquiries-table-body');
            
            const { data, error } = await db
                .from('inquiries')
                .select(`
                    id,
                    message,
                    status,
                    vendor_id,
                    product_id,
                    buyer_id,
                    buyers ( full_name, email ),
                    products ( name, price )
                `)
                .eq('status', 'pending');

            if (error) {
                console.error('Error loading inquiries:', error.message);
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #e74c3c;">Failed to load inquiries.</td></tr>`;
                return;
            }

            if (data && data.length > 0) {
                tbody.innerHTML = data.map(item => `
                    <tr>
                        <td>#${item.id.slice(0, 8)}</td>
                        <td><strong>${item.buyers?.full_name || item.buyers?.email || 'Unknown Buyer'}</strong></td>
                        <td>${item.products?.name || 'Product'}</td>
                        <td>${item.vendor_id || 'Echo Hub'}</td>
                        <td>${item.message}</td>
                        <td>
                            <button class="btn-verify" onclick="verifyProductInquiry('${item.id}', '${item.buyer_id}', '${item.product_id}', '${item.vendor_id || 'Echo Hub'}')">Verify Product</button>
                        </td>
                    </tr>
                `).join('');
            } else {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #718096; padding: 20px;">No pending inquiries to verify.</td></tr>`;
            }
        }

        async function verifyProductInquiry(inquiryId, buyerId, productId, vendorId) {
            try {
                const { data: vendor, error: vendorErr } = await db
                    .from('vendors')
                    .select('commission_amount')
                    .eq('id', vendorId)
                    .single();
                    
                if (vendorErr) throw vendorErr;

                const grossCommission = parseFloat(vendor?.commission_amount || 0);
                
                if (grossCommission < 5.00) {
                    alert(`Warning: Vendor commission ($${grossCommission.toFixed(2)}) is below the mandatory $5.00 USD minimum policy threshold.`);
                }

                // Apply PayPal Goods and Services fee structure (3.49% + $0.49 USD)
                const payPalPercentageFee = grossCommission * 0.0349;
                const payPalFixedFee = 0.49;
                const totalPayPalFee = payPalPercentageFee + payPalFixedFee;

                const netRealizedCommission = grossCommission - totalPayPalFee;

                if (netRealizedCommission <= 0) {
                    throw new Error('Net commission after PayPal Goods & Services fees is $0.00 or negative.');
                }

                const { data: buyer, error: buyerErr } = await db
                    .from('buyers')
                    .select('referred_by')
                    .eq('id', buyerId)
                    .single();
                    
                if (buyerErr) throw buyerErr;

                if (buyer && buyer.referred_by) {
                    const referrerSplit = netRealizedCommission * 0.20;

                    const { error: ledgerErr } = await db
                        .from('referral_ledger')
                        .insert([{
                            referrer_id: buyer.referred_by,
                            buyer_id: buyerId,
                            inquiry_id: inquiryId,
                            gross_commission: grossCommission,
                            paypal_fee: totalPayPalFee,
                            net_commission: netRealizedCommission,
                            commission_amount: referrerSplit,
                            status: 'pending'
                        }]);
                        
                    if (ledgerErr) throw ledgerErr;
                    console.log(`Gross: $${grossCommission.toFixed(2)} | G&S Fee: -$${totalPayPalFee.toFixed(2)} | Net: $${netRealizedCommission.toFixed(2)} | 20% Referrer Split: $${referrerSplit.toFixed(2)} credited.`);
                }

                const { error: updateErr } = await db
                    .from('inquiries')
                    .update({ status: 'verified' })
                    .eq('id', inquiryId);
                    
                if (updateErr) throw updateErr;

                alert(`Product verified successfully! G&S fee deducted ($${totalPayPalFee.toFixed(2)}). Referrer split recorded from net balance.`);
                loadInquiries();

            } catch (error) {
                console.error('Verification Error:', error.message);
                alert('Failed to verify product. Check console details.');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadInquiries();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo Hub - Vendor Registration</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(135deg, #f5f7fa 0%, #e8f0f8 100%);
  background-attachment: fixed;
  min-height: 100vh;
  padding: 20px;
}
.container {
  max-width: 800px;
  margin: 40px auto;
  background: white;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(30, 90, 168, 0.08);
  overflow: hidden;
}
header {
  background: linear-gradient(135deg, #1e5aa8 0%, #2e7bb4 100%);
  color: white;
  padding: 30px;
  text-align: center;
}
header h1 {
  font-size: 2.5em;
  margin-bottom: 5px;
}
header p {
  font-size: 1.1em;
  opacity: 0.95;
  margin: 0;
}
.content {
  padding: 40px;
}
.section h2 {
  color: #1e5aa8;
  margin-bottom: 25px;
  font-size: 1.6em;
  font-weight: 700;
}
.form-group {
  margin-bottom: 22px;
}
label {
  display: block;
  margin-bottom: 8px;
  color: #2c3e50;
  font-weight: 600;
  font-size: 0.95em;
}
input[type="text"],
input[type="email"],
textarea {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid #e1e8ed;
  border-radius: 10px;
  font-family: inherit;
  font-size: 15px;
  transition: all 0.35s ease;
  background: white;
  color: #2c3e50;
}
input:focus, textarea:focus {
  outline: none;
  border-color: #1e5aa8;
  background: #f8fbff;
  box-shadow: 0 0 0 3px rgba(30, 90, 168, 0.08);
}
textarea {
  resize: vertical;
  min-height: 100px;
}
button[type="submit"] {
  background: linear-gradient(135deg, #1e5aa8 0%, #2e7bb4 100%);
  color: white;
  padding: 14px 32px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  width: 100%;
  margin-top: 10px;
}
button[type="submit"]:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 24px rgba(30, 90, 168, 0.25);
}
.error {
  color: #c0392b;
  background: #fadbd8;
  padding: 16px;
  border-radius: 10px;
  margin-bottom: 20px;
  display: none;
  border-left: 4px solid #c0392b;
  font-weight: 500;
  font-size: 14px;
}
.success {
  color: #27ae60;
  background: #d5f4e6;
  padding: 16px;
  border-radius: 10px;
  margin-bottom: 20px;
  display: none;
  border-left: 4px solid #27ae60;
  font-weight: 500;
  font-size: 14px;
}
</style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Echo Hub</h1>
            <p>Vendor Onboarding Portal</p>
        </header>

        <div class="content">
            <div class="section">
                <h2>📦 Vendor Registration</h2>
                <div class="error" id="vendorError"></div>
                <div class="success" id="vendorSuccess"></div>

                <form id="vendorForm">
                    <div class="form-group">
                        <label for="firstName">First Name *</label>
                        <input type="text" id="firstName" placeholder="Enter your first name" required>
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name *</label>
                        <input type="text" id="lastName" placeholder="Enter your last name" required>
                    </div>

                    <div class="form-group">
                        <label for="paypalEmail">PayPal Email * (For Payouts)</label>
                        <input type="email" id="paypalEmail" placeholder="your-paypal@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="businessDetails">Business Details / Products Offered</label>
                        <textarea id="businessDetails" placeholder="Briefly describe what you sell..."></textarea>
                    </div>

                    <button type="submit">Register as Vendor</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pueffzvcnonfyjftloto.supabase.co';[cite: 2]
        const SUPABASE_ANON_KEY = 'sb_publishable_IMUxKFnuQIQP2XmfXhc6zQ_HVYZSKZS';[cite: 2]
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);[cite: 2]

        const urlParams = new URLSearchParams(window.location.search);
        const referredBy = urlParams.get('ref') || null;

        document.getElementById('vendorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('vendorError');
            const successDiv = document.getElementById('vendorSuccess');
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const paypalEmail = document.getElementById('paypalEmail').value.trim();
            const businessDetails = document.getElementById('businessDetails').value.trim();

            try {
                const { error: dbError } = await supabaseClient
                    .from('vendors')
                    .insert([{
                        first_name: firstName,
                        last_name: lastName,
                        paypal_email: paypalEmail,
                        business_details: businessDetails || null,
                        referred_by: referredBy
                    }]);

                if (dbError) throw dbError;

                successDiv.textContent = 'Vendor registration successful! Your ID will be generated upon review.';
                successDiv.style.display = 'block';
                document.getElementById('vendorForm').reset();

            } catch (err) {
                console.error(err);
                errorDiv.textContent = 'Error during registration: ' + err.message;
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Account Portal & Authentication</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8f0f8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #2c3e50;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(30, 90, 168, 0.08);
            overflow: hidden;
            padding: 40px;
        }

        h2 {
            color: #1e5aa8;
            font-size: 1.8em;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.95em;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85em;
            font-weight: 600;
            color: #475569;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            color: #1e293b;
            background: #fff;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #1e5aa8;
            background: #f8fafc;
        }

        input[type="file"] {
            padding: 10px 0;
            color: #2c3e50;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
            background: #fafbfc;
            padding: 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: normal;
            color: #2c3e50;
            cursor: pointer;
            font-size: 0.9em;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #1e5aa8;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            background: #1e5aa8;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #174887;
        }

        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .alert-msg {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.85em;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #dcfce7;
            color: #15803d;
        }

        .alert-error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .toggle-mode {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9em;
            color: #64748b;
        }

        .toggle-mode a {
            color: #1e5aa8;
            text-decoration: none;
            font-weight: 600;
        }

        .toggle-mode a:hover {
            text-decoration: underline;
        }

        .row-fields {
            display: flex;
            gap: 12px;
        }

        @media (max-width: 600px) {
            .checkbox-group {
                grid-template-columns: 1fr;
            }
            .auth-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div id="formHeader">
            <h2 id="formTitle">Account Login</h2>
            <p class="subtitle" id="formSubtitle">Access your Echo Hub marketplace account or dashboard</p>
        </div>

        <div id="authAlert" class="alert-msg"></div>

        <form id="authForm">
            <!-- Extra Registration Fields (Hidden by default) -->
            <div id="registerFields" style="display: none;">
                <div class="form-group">
                    <label for="accountType">I want to register as a:</label>
                    <select id="accountType">
                        <option value="buyer">Buyer / Reviewer</option>
                        <option value="vendor">Vendor Partner</option>
                    </select>
                </div>

                <!-- BUYER-SPECIFIC FIELDS (Consolidated from register.html) -->
                <div id="buyerSpecificFields" style="display: block;">
                    <div class="row-fields">
                        <div class="form-group" style="flex: 1;">
                            <label for="buyerFirstName">First Name *</label>
                            <input type="text" id="buyerFirstName" placeholder="First Name">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label for="buyerLastName">Last Name *</label>
                            <input type="text" id="buyerLastName" placeholder="Last Name">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="whatsapp">WhatsApp Number (Optional)</label>
                        <input type="text" id="whatsapp" placeholder="e.g., +18765555555">
                    </div>

                    <div class="form-group">
                        <label>Categories of Interest *</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label"><input type="checkbox" name="category" value="Wigs"> Wigs</label>
                            <label class="checkbox-label"><input type="checkbox" name="category" value="Toys"> Toys</label>
                            <label class="checkbox-label"><input type="checkbox" name="category" value="Gadgets"> Gadgets</label>
                            <label class="checkbox-label"><input type="checkbox" name="category" value="Clothing"> Clothing</label>
                            <label class="checkbox-label"><input type="checkbox" name="category" value="Office Furniture"> Office Furniture</label>
                            <label class="checkbox-label"><input type="checkbox" name="category" value="All"> All (including future products)</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="nationalIdFile">Upload Your National ID * (Mandatory)</label>
                        <input type="file" id="nationalIdFile">
                    </div>
                </div>

                <!-- VENDOR-SPECIFIC FIELDS -->
                <div id="vendorSpecificFields" style="display: none;">
                    <div class="row-fields">
                        <div class="form-group" style="flex: 1;">
                            <label for="firstName">First Name</label>
                            <input type="text" id="firstName" placeholder="India">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label for="lastName">Last Name</label>
                            <input type="text" id="lastName" placeholder="Stronghold">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="vendorType">Vendor Classification</label>
                        <input type="text" id="vendorType" value="UPFRONT" placeholder="UPFRONT">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Account Email</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
        </form>

        <div class="toggle-mode">
            <span id="toggleText">New to Echo Hub?</span>
            <a href="#" id="toggleBtn">Create an account</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nvtqtkllmsiqknogmarc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ju4wLLra1DBXDyGiHGOB7w_TdsjcBj1';
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        let isRegisterMode = false;

        const authForm = document.getElementById('authForm');
        const formTitle = document.getElementById('formTitle');
        const formSubtitle = document.getElementById('formSubtitle');
        const submitBtn = document.getElementById('submitBtn');
        const toggleBtn = document.getElementById('toggleBtn');
        const toggleText = document.getElementById('toggleText');
        const registerFields = document.getElementById('registerFields');
        const accountTypeSelect = document.getElementById('accountType');
        const buyerSpecificFields = document.getElementById('buyerSpecificFields');
        const vendorSpecificFields = document.getElementById('vendorSpecificFields');
        const authAlert = document.getElementById('authAlert');

        // Handle logout request from index.html
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('logout') === 'true') {
            localStorage.removeItem('buyer_id');
            localStorage.removeItem('buyer_email');
            localStorage.removeItem('vendor_id');
            localStorage.removeItem('vendor_email');
            localStorage.removeItem('user_email');
            if (supabaseClient) {
                supabaseClient.auth.signOut();
            }
        }

        // Toggle visibility of account-type-specific fields
        accountTypeSelect.addEventListener('change', (e) => {
            if (e.target.value === 'vendor') {
                buyerSpecificFields.style.display = 'none';
                vendorSpecificFields.style.display = 'block';
            } else {
                buyerSpecificFields.style.display = 'block';
                vendorSpecificFields.style.display = 'none';
            }
        });

        // Toggle between Login and Registration views
        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isRegisterMode = !isRegisterMode;
            showAlert('', false);

            if (isRegisterMode) {
                formTitle.textContent = 'Create Account';
                formSubtitle.textContent = 'Set up your Echo Hub marketplace account';
                submitBtn.textContent = 'Complete Registration';
                registerFields.style.display = 'block';
                toggleText.textContent = 'Already have an account?';
                toggleBtn.textContent = 'Sign in';
            } else {
                formTitle.textContent = 'Account Login';
                formSubtitle.textContent = 'Access your Echo Hub marketplace account or dashboard';
                submitBtn.textContent = 'Sign In';
                registerFields.style.display = 'none';
                toggleText.textContent = 'New to Echo Hub?';
                toggleBtn.textContent = 'Create an account';
            }
        });

        // Handle Form Submission (Login or Register)
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            showAlert('', false);
            submitBtn.disabled = true;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                if (!supabaseClient) throw new Error('Supabase client failed to initialize.');

                if (isRegisterMode) {
                    // --- REGISTRATION FLOW ---
                    const accountType = accountTypeSelect.value;

                    submitBtn.textContent = 'Creating account...';

                    if (accountType === 'vendor') {
                        // --- VENDOR REGISTRATION ---
                        const firstName = document.getElementById('firstName').value.trim() || 'Vendor';
                        const lastName = document.getElementById('lastName').value.trim() || 'Partner';
                        const vendorType = document.getElementById('vendorType').value.trim() || 'UPFRONT';

                        // 1. Create Supabase Auth User
                        const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                            email,
                            password,
                            options: { data: { first_name: firstName, last_name: lastName, role: 'vendor' } }
                        });

                        if (authError) throw new Error(authError.message);
                        if (!authData.user) throw new Error('Registration failed to return user session.');

                        const authUuid = authData.user.id;

                        // 2. Get vendor count for sequential ID
                        const { count, error: countError } = await supabaseClient
                            .from('vendors')
                            .select('*', { count: 'exact', head: true });

                        if (countError) throw new Error('Could not calculate vendor sequence.');

                        const nextNum = (count || 0) + 1;
                        const formattedId = `${firstName}-${lastName}-${String(nextNum).padStart(5, '0')}`;

                        // 3. Insert vendor record
                        const { error: insertError } = await supabaseClient.from('vendors').insert([
                            {
                                id: formattedId,
                                user_id: authUuid,
                                email: email,
                                first_name: firstName,
                                last_name: lastName,
                                vendor_type: vendorType,
                                status: 'ACTIVE',
                                created_at: new Date()
                            }
                        ]);

                        if (insertError) throw new Error('Vendor profile creation error: ' + insertError.message);

                        showAlert('Registration successful! Redirecting to dashboard...', false);
                        setTimeout(() => { window.location.href = 'manage.html'; }, 1000);

                    } else {
                        // --- BUYER REGISTRATION (CONSOLIDATED FROM REGISTER.HTML) ---
                        const buyerFirstName = document.getElementById('buyerFirstName').value.trim();
                        const buyerLastName = document.getElementById('buyerLastName').value.trim();
                        const fullName = buyerFirstName + ' ' + buyerLastName;
                        const whatsapp = document.getElementById('whatsapp').value.trim();
                        const fileInput = document.getElementById('nationalIdFile').files[0];

                        // Validate required buyer fields
                        if (!buyerFirstName) throw new Error('First Name is required.');
                        if (!buyerLastName) throw new Error('Last Name is required.');
                        if (!fileInput) throw new Error('National ID file is required.');

                        const selectedCategories = Array.from(document.querySelectorAll('input[name="category"]:checked'))
                            .map(cb => cb.value);

                        if (selectedCategories.length === 0) {
                            throw new Error('Please select at least one category of interest.');
                        }

                        // Convert file to Base64 using safe chunked approach (8KB chunks)
                        const arrayBuffer = await fileInput.arrayBuffer();
                        const uint8Array = new Uint8Array(arrayBuffer);

                        let base64Data = '';
                        const chunkSize = 8192;
                        for (let i = 0; i < uint8Array.length; i += chunkSize) {
                            const chunk = uint8Array.subarray(i, i + chunkSize);
                            base64Data += String.fromCharCode.apply(null, Array.from(chunk));
                        }
                        base64Data = btoa(base64Data);

                        const fileExt = fileInput.name.split('.').pop() || 'bin';
                        const mimeType = fileInput.type || 'application/octet-stream';

                        // Insert buyer record directly into buyers table
                        const { error: insertError } = await supabaseClient.from('buyers').insert([
                            {
                                full_name: fullName,
                                email: email,
                                password: password || null,
                                whatsapp_number: whatsapp || null,
                                categories_interest: selectedCategories,
                                national_id_file_name: fileInput.name,
                                national_id_file_type: mimeType,
                                national_id_file_size: uint8Array.length,
                                national_id_data: base64Data,
                                approval_status: 'pending',
                                created_at: new Date()
                            }
                        ]);

                        if (insertError) throw new Error('Buyer profile creation error: ' + insertError.message);

                        showAlert('Registration successful! Your national ID will be reviewed. You will be notified via email once verified.', false);
                        setTimeout(() => { window.location.href = 'index.html'; }, 2000);
                    }

                } else {
                    // --- LOGIN FLOW ---
                    submitBtn.textContent = 'Signing in...';

                    // 1. Check if user is a Vendor first - query vendors table directly by email
                    const { data: vendorData, error: vendorError } = await supabaseClient
                        .from('vendors')
                        .select('*')
                        .eq('email', email)
                        .maybeSingle();

                    if (vendorData && vendorData.password) {
                        // Verify password using PBKDF2 (100k iterations, SHA-256)
                        const passwordMatch = await verifyPBKDF2Password(password, vendorData.password);
                        if (passwordMatch) {
                            // Store vendor session in localStorage for manage.html
                            localStorage.setItem('vendor_id', vendorData.id);
                            localStorage.setItem('vendor_email', vendorData.email);
                            window.location.href = 'manage.html';
                            return;
                        } else {
                            throw new Error('Invalid login credentials');
                        }
                    }

                    // 2. Check if user is a Buyer - query buyers table directly by email
                    const { data: buyerData, error: buyerError } = await supabaseClient
                        .from('buyers')
                        .select('*')
                        .eq('email', email)
                        .maybeSingle();

                    if (buyerData) {
                        // Verify password using PBKDF2
                        const passwordMatch = await verifyPBKDF2Password(password, buyerData.password);
                        if (passwordMatch) {
                            // Check approval status (case-insensitive)
                            if (buyerData.approval_status?.toLowerCase() !== 'approved') {
                                throw new Error(`Your account is ${buyerData.approval_status}. You will receive access once your national ID is verified.`);
                            }
                            // Store buyer session in localStorage for index.html
                            localStorage.setItem('buyer_id', buyerData.id);
                            localStorage.setItem('buyer_email', buyerData.email);
                            window.location.href = 'index.html';
                            return;
                        } else {
                            throw new Error('Invalid login credentials');
                        }
                    }

                    // 3. If not vendor or buyer, try Supabase Auth (fallback for legacy user_profiles)
                    const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                        email,
                        password
                    });

                    if (authError) throw new Error(authError.message);
                    const authUser = authData.user;

                    // 4. Check if user is a Buyer profile in user_profiles table
                    const { data: userProfileData } = await supabaseClient
                        .from('user_profiles')
                        .select('*')
                        .eq('id', authUser.id)
                        .maybeSingle();

                    if (userProfileData) {
                        // SECURITY: Even via legacy auth, check buyer approval status and get numeric ID
                        const { data: buyerCheckData } = await supabaseClient
                            .from('buyers')
                            .select('id, approval_status')
                            .eq('email', email)
                            .maybeSingle();

                        if (buyerCheckData && buyerCheckData.approval_status?.toLowerCase() !== 'approved') {
                            throw new Error(`Your account is ${buyerCheckData.approval_status}. You will receive access once your national ID is verified.`);
                        }

                        // Store buyer session (use numeric ID as primary, not Supabase UUID)
                        localStorage.setItem('buyer_id', buyerCheckData.id);
                        localStorage.setItem('buyer_email', email);
                        window.location.href = 'index.html';
                        return;
                    }

                    // Fallback to index if no profile table matches
                    window.location.href = 'index.html';
                }

            } catch (err) {
                showAlert(err.message, true);
                submitBtn.disabled = false;
                submitBtn.textContent = isRegisterMode ? 'Complete Registration' : 'Sign In';
            }
        });

        async function verifyPBKDF2Password(inputPassword, storedHashBase64) {
            // storedHash format: Base64(16-byte salt + 32-byte PBKDF2 hash)
            if (!storedHashBase64 || typeof storedHashBase64 !== 'string') return false;

            try {
                // Decode Base64 to get salt + hash bytes
                const binaryData = atob(storedHashBase64);
                const dataArray = new Uint8Array(binaryData.length);
                for (let i = 0; i < binaryData.length; i++) {
                    dataArray[i] = binaryData.charCodeAt(i);
                }

                // Extract salt (first 16 bytes) and expected hash (remaining 32 bytes)
                const saltBuffer = dataArray.slice(0, 16);
                const expectedHash = dataArray.slice(16, 48);

                // Compute PBKDF2 with input password
                const encoder = new TextEncoder();
                const keyMaterial = await crypto.subtle.importKey(
                    'raw',
                    encoder.encode(inputPassword),
                    { name: 'PBKDF2' },
                    false,
                    ['deriveBits']
                );

                const derivedBits = await crypto.subtle.deriveBits(
                    {
                        name: 'PBKDF2',
                        salt: saltBuffer,
                        iterations: 100000,
                        hash: 'SHA-256'
                    },
                    keyMaterial,
                    256
                );

                // Compare computed hash with stored hash
                const computedHash = new Uint8Array(derivedBits);
                return computedHash.every((byte, index) => byte === expectedHash[index]);
            } catch (err) {
                console.error('PBKDF2 verification error:', err);
                return false;
            }
        }

        function showAlert(msg, isError) {
            if (!msg) {
                authAlert.style.display = 'none';
                return;
            }
            authAlert.textContent = msg;
            authAlert.className = 'alert-msg ' + (isError ? 'alert-error' : 'alert-success');
            authAlert.style.display = 'block';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Vendor Onboarding Portal</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Styling omitted for brevity - see full code */
        .password-wrapper {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #1e5aa8;
            font-size: 18px;
            padding: 5px;
        }
    </style>
</head>
<body>
    /* Form HTML structure omitted for brevity */

    <script>
        // ✅ CORRECTED: Matching buyer Supabase instance
        const SUPABASE_URL = 'https://nvtqtkllmsiqknogmarc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ju4wLLra1DBXDyGiHGOB7w_TdsjcBj1';
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        // ✅ Password toggle functionality
        const passwordInput = document.getElementById('password');
        const toggleButton = document.getElementById('togglePassword');
        toggleButton.addEventListener('click', (e) => {
            e.preventDefault();
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            toggleButton.textContent = type === 'password' ? 'Show' : 'Hide';
        });

        // ✅ Form submission - DIRECT DATABASE INSERT (not auth.signUp)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const vendorRecord = {
                vendor_type: vendorType,
                first_name: firstName,
                last_name: lastName,
                email: email,
                password: password,
                business_details: businessDetails
            };

            try {
                console.log('[DB] Inserting vendor record');

                // ✅ Direct insert to vendors table (NOT auth)
                const { data, error } = await supabaseClient.from('vendors').insert([vendorRecord]).select();

                if (error) {
                    throw new Error(`Database insert failed: ${error.message}`);
                }

                console.log('[SUCCESS] Vendor registration complete');
                successAlert.style.display = 'block';
                form.reset();

            } catch (err) {
                console.error('[ERROR]', err);
                errorMessage.textContent = 'Error during registration: ' + err.message;
                errorAlert.style.display = 'block';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Vendor Product Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #f5f7fa 0%, #e8f0f8 100%) !important;
            background-attachment: fixed !important;
            min-height: 100vh;
            color: #2c3e50; 
        }
        header {
            background: linear-gradient(135deg, #1e5aa8 0%, #2e7bb4 100%) !important;
            color: white !important;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(30, 90, 168, 0.1);
            margin-bottom: 30px;
        }
        header h1 { font-size: 2.2em; margin-bottom: 5px; font-weight: 700; color: white !important; }
        header p { font-size: 1.05em; opacity: 0.95; margin: 0; color: white !important; }
        .hub-card {
            background: #ffffff !important;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(30, 90, 168, 0.05);
        }
        .btn-primary {
            background: linear-gradient(135deg, #1e5aa8 0%, #2e7bb4 100%) !important;
            color: #fff !important;
            font-weight: 600;
            transition: opacity 0.2s ease;
        }
        .btn-primary:hover { opacity: 0.9; }
        .custom-input {
            width: 100%;
            border: 1px solid #cbd5e1;
            padding: 10px;
            border-radius: 6px;
            background-color: #fff;
            color: #2c3e50;
            outline: none;
        }
        .custom-input:focus {
            border-color: #1e5aa8;
            box-shadow: 0 0 0 2px rgba(30, 90, 168, 0.15);
        }
    </style>
</head>
<body class="p-6">

    <header>
        <h1>Echo Hub</h1>
        <p>Vendor Product Management Portal</p>
    </header>

    <div class="max-w-xl mx-auto hub-card p-8">
        <h2 id="form-title" class="text-2xl font-bold mb-6" style="color: #1e5aa8;">Create New Product Listing</h2>
        
        <form id="product-form" onsubmit="handleFormSubmit(event)">
            <input type="hidden" id="product-id">

            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Vendor ID</label>
                <input type="text" id="vendor-id" required placeholder="e.g. Roxroy-Brown-00001" class="custom-input">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Product Name</label>
                <input type="text" id="product-name" required placeholder="e.g. Wireless Earbuds" class="custom-input">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Category</label>
                <select id="product-category" required class="custom-input">
                    <option value="">-- Select a category --</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Home and Kitchen">Home and Kitchen</option>
                    <option value="Beauty and Personal Care">Beauty and Personal Care</option>
                    <option value="Fitness and Outdoors">Fitness and Outdoors</option>
                    <option value="Office and Productivity">Office and Productivity</option>
                    <option value="Adult Novelties">Adult Novelties</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Price ($)</label>
                <input type="number" step="0.01" id="product-price" required placeholder="29.99" class="custom-input">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Primary Image URL (.jpg, .png)</label>
                <input type="url" id="image-url-1" required placeholder="https://example.com/image1.jpg" class="custom-input">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 font-medium mb-2">Secondary Image URL (Optional)</label>
                <input type="url" id="image-url-2" placeholder="https://example.com/image2.jpg" class="custom-input">
            </div>

            <div class="flex gap-4">
                <button type="submit" id="submit-btn" class="flex-1 btn-primary py-2 px-4 rounded transition">Publish Listing</button>
                <button type="button" onclick="resetForm()" class="bg-gray-200 text-gray-700 py-2 px-4 rounded hover:bg-gray-300 transition">Cancel</button>
            </div>
        </form>

        <div class="mt-8 border-t pt-6">
            <h3 class="text-lg font-semibold mb-3 text-gray-800">Select Existing Product to Edit</h3>
            <div class="flex gap-2">
                <select id="product-select" class="flex-1 custom-input">
                    <option value="">-- Choose a product --</option>
                </select>
                <button type="button" onclick="loadSelectedProduct()" class="btn-primary px-4 py-2 rounded transition">Load</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pueffzvcnonfyjftloto.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_IMUxKFnuQIQP2XmfXhc6zQ_HVYZSKZS';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function initializeFormDropdowns() {
            const productSelect = document.getElementById('product-select');
            const categorySelect = document.getElementById('product-category');
            
            productSelect.innerHTML = '<option value="">-- Choose a product --</option>';

            const { data, error } = await db.from('products').select('id, name, category');

            if (!error && data) {
                data.forEach(product => {
                    const option = document.createElement('option');
                    option.value = product.id;
                    option.textContent = product.name;
                    productSelect.appendChild(option);
                });

                const existingCategories = [...new Set(data.map(p => p.category).filter(Boolean))];
                const baseCategories = ["Electronics", "Home and Kitchen", "Beauty and Personal Care", "Fitness and Outdoors", "Office and Productivity", "Adult Novelties"];
                const combinedCategories = [...new Set([...baseCategories, ...existingCategories])];

                categorySelect.innerHTML = '<option value="">-- Select a category --</option>' + 
                    combinedCategories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
            }
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            const productId = document.getElementById('product-id').value;
            const vendor_id = document.getElementById('vendor-id').value;
            const name = document.getElementById('product-name').value;
            const category = document.getElementById('product-category').value;
            const price = parseFloat(document.getElementById('product-price').value);
            const image_url_1 = document.getElementById('image-url-1').value;
            const image_url_2 = document.getElementById('image-url-2').value;

            if (productId) {
                const { error } = await db.from('products')
                    .update({ vendor_id, name, category, price, image_url_1, image_url_2 })
                    .eq('id', productId);
                if (error) alert('Error updating listing: ' + error.message);
                else {
                    alert('Listing successfully updated!');
                    window.location.href = 'index.html';
                }
            } else {
                const { error } = await db.from('products')
                    .insert([{ vendor_id, name, category, price, image_url_1, image_url_2 }]);
                if (error) alert('Error publishing listing: ' + error.message);
                else {
                    alert('Listing successfully published!');
                    window.location.href = 'index.html';
                }
            }
        }

        async function loadSelectedProduct() {
            const productId = document.getElementById('product-select').value;
            if (!productId) return alert('Please select a product first.');

            const { data, error } = await db.from('products').select('*').eq('id', productId).single();
            if (error || !data) return alert('Could not load product details.');

            document.getElementById('product-id').value = data.id;
            document.getElementById('vendor-id').value = data.vendor_id || '';
            document.getElementById('product-name').value = data.name || '';
            document.getElementById('product-category').value = data.category || '';
            document.getElementById('product-price').value = data.price || '';
            document.getElementById('image-url-1').value = data.image_url_1 || '';
            document.getElementById('image-url-2').value = data.image_url_2 || '';

            document.getElementById('form-title').innerText = `Edit Product: ${data.name}`;
            document.getElementById('submit-btn').innerText = 'Save Changes';
        }

        function resetForm() {
            document.getElementById('product-form').reset();
            document.getElementById('product-id').value = '';
            document.getElementById('form-title').innerText = 'Create New Product Listing';
            document.getElementById('submit-btn').innerText = 'Publish Listing';
        }

        window.addEventListener('DOMContentLoaded', initializeFormDropdowns);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Login</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Bcrypt for password verification -->
    <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/bcryptjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8f0f8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #2c3e50;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(30, 90, 168, 0.08);
            overflow: hidden;
            padding: 40px;
        }

        h2 {
            color: #1e5aa8;
            font-size: 1.8em;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.95em;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85em;
            font-weight: 600;
            color: #475569;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            color: #1e293b;
            background: #fff;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #1e5aa8;
            background: #f8fafc;
        }

        .btn-submit {
            width: 100%;
            background: #1e5aa8;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #174887;
        }

        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .alert-msg {
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 0.85em;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #dcfce7;
            color: #15803d;
        }

        .alert-error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .alert-warning {
            background: #fef3c7;
            color: #d97706;
        }

        .account-type-selection {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .account-type-btn {
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.2s;
            text-align: center;
        }

        .account-type-btn:hover {
            border-color: #1e5aa8;
            background: #f8fafc;
        }

        .account-type-btn.active {
            background: #1e5aa8;
            color: white;
            border-color: #1e5aa8;
        }

        .register-links {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85em;
            color: #64748b;
            line-height: 1.8;
        }

        .register-links a {
            color: #1e5aa8;
            text-decoration: none;
            font-weight: 600;
        }

        .register-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div id="formHeader">
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to your Echo Hub account</p>
        </div>

        <div id="authAlert" class="alert-msg"></div>

        <!-- Account Type Selection -->
        <div class="account-type-selection">
            <button type="button" class="account-type-btn active" data-type="buyer">🛍️ Buyer</button>
            <button type="button" class="account-type-btn" data-type="vendor">🏪 Vendor</button>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="your@email.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
        </form>

        <div class="register-links">
            Don't have an account? <a href="buyer-register.html">Register as Buyer</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nvtqtkllmsiqknogmarc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ju4wLLra1DBXDyGiHGOB7w_TdsjcBj1';
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        let selectedAccountType = 'buyer';

        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const authAlert = document.getElementById('authAlert');

        // Account Type Selection
        document.querySelectorAll('.account-type-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.account-type-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedAccountType = btn.dataset.type;
                showAlert('', false);
            });
        });

        // Handle Login Form Submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            showAlert('', false);
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                if (!supabaseClient) throw new Error('Supabase client failed to initialize.');
                if (typeof bcryptjs === 'undefined') throw new Error('Security library failed to load. Please refresh the page and try again.');

                if (selectedAccountType === 'vendor') {
                    // VENDOR LOGIN
                    console.log('[VENDOR_LOGIN] Querying vendors table for email:', email);

                    const { data: vendorData, error: queryError } = await supabaseClient
                        .from('vendors')
                        .select('*')
                        .eq('email', email)
                        .single();

                    if (queryError || !vendorData) {
                        throw new Error('Vendor account not found. Please register at vendor registration portal.');
                    }

                    // Verify password with bcryptjs
                    console.log('[VENDOR_LOGIN] Verifying password');
                    const passwordMatch = await bcryptjs.compare(password, vendorData.password);

                    if (!passwordMatch) {
                        throw new Error('Invalid email or password.');
                    }

                    // Store vendor session
                    console.log('[VENDOR_LOGIN] Login successful, storing session');
                    localStorage.setItem('vendor_id', vendorData.id);
                    localStorage.setItem('vendor_email', vendorData.email);
                    localStorage.setItem('vendor_is_blocked', vendorData.is_blocked);
                    localStorage.setItem('vendor_session', JSON.stringify(vendorData));

                    if (vendorData.is_blocked) {
                        showAlert('⚠️ Your account is currently blocked. Update your commission to activate.', 'warning');
                        setTimeout(() => {
                            window.location.href = 'manage.html';
                        }, 1500);
                    } else {
                        showAlert('Login successful! Redirecting to dashboard...', false);
                        setTimeout(() => {
                            window.location.href = 'manage.html';
                        }, 1000);
                    }

                } else {
                    // BUYER LOGIN
                    console.log('[BUYER_LOGIN] Querying buyers for email:', email);

                    const { data: buyerData, error: queryError } = await supabaseClient
                        .from('buyers')
                        .select('*')
                        .eq('email', email)
                        .single();

                    if (queryError || !buyerData) {
                        throw new Error('Buyer account not found. Please register first.');
                    }

                    // Verify password with bcryptjs
                    console.log('[BUYER_LOGIN] Verifying password');
                    const passwordMatch = await bcryptjs.compare(password, buyerData.password);

                    if (!passwordMatch) {
                        throw new Error('Invalid email or password.');
                    }

                    // Check approval status
                    if (buyerData.approval_status !== 'APPROVED') {
                        throw new Error('Your account is pending approval. Please check your email for updates.');
                    }

                    // Store buyer session
                    console.log('[BUYER_LOGIN] Login successful, storing session');
                    localStorage.setItem('buyer_id', buyerData.id);
                    localStorage.setItem('buyer_email', buyerData.email);
                    localStorage.setItem('buyer_referral_code', buyerData.referral_code);
                    localStorage.setItem('buyer_session', JSON.stringify(buyerData));

                    showAlert('Login successful! Redirecting to marketplace...', false);
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                }

            } catch (err) {
                console.error('[LOGIN_ERROR]', err);
                showAlert(err.message, true);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });

        function showAlert(msg, isError) {
            if (!msg) {
                authAlert.style.display = 'none';
                return;
            }
            authAlert.textContent = msg;
            if (isError === true) {
                authAlert.className = 'alert-msg alert-error';
            } else if (isError === 'warning') {
                authAlert.className = 'alert-msg alert-warning';
            } else {
                authAlert.className = 'alert-msg alert-success';
            }
            authAlert.style.display = 'block';
        }
    </script>
</body>
</html>

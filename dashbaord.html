<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Vendor Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8f0f8 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 40px auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(30, 90, 168, 0.08);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #1e5aa8 0%, #2e7bb4 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.8em;
            font-weight: 700;
        }

        .btn-logout {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .content {
            padding: 40px;
        }

        .loading, .error-state {
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-size: 16px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-card {
            background: #f8fbff;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            padding: 20px;
        }

        .info-card h3 {
            color: #1e5aa8;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .info-card p {
            color: #2c3e50;
            font-size: 1.2em;
            font-weight: 600;
        }

        .section-title {
            color: #1e5aa8;
            font-size: 1.4em;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-approved {
            background: #d5f4e6;
            color: #27ae60;
        }

        .status-pending {
            background: #fef3c7;
            color: #d97706;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="headerTitle">Vendor Dashboard</h1>
            <button id="logoutBtn" class="btn-logout">Sign Out</button>
        </header>

        <div class="content">
            <div id="loadingState" class="loading">
                Verifying session and loading your profile...
            </div>

            <div id="errorState" class="error-state" style="display: none;">
                <h3>Profile Not Found</h3>
                <p>We couldn't find a registered vendor profile associated with this email address.</p>
                <a href="portal.html" style="color: #1e5aa8; display: inline-block; margin-top: 15px;">&larr; Return to Portal</a>
            </div>

            <div id="dashboardContent" style="display: none;">
                <div class="card-grid">
                    <div class="info-card">
                        <h3>Vendor ID</h3>
                        <p id="vendorIdDisplay">Loading...</p>
                    </div>
                    <div class="info-card">
                        <h3>Account Type</h3>
                        <p id="vendorTypeDisplay">Loading...</p>
                    </div>
                    <div class="info-card">
                        <h3>Approval Status</h3>
                        <div style="margin-top: 5px;"><span id="statusDisplay" class="status-badge">Loading...</span></div>
                    </div>
                </div>

                <div class="section-title">Store & Business Details</div>
                <div class="info-card" style="margin-bottom: 30px;">
                    <p id="businessDetailsDisplay" style="font-weight: normal; font-size: 1em; color: #475569; line-height: 1.5;">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pueffzvcnonfyjftloto.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_IMUxKFnuQIQP2XmfXhc6zQ_HVYZSKZS';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const dashboardContent = document.getElementById('dashboardContent');
        
        const vendorIdDisplay = document.getElementById('vendorIdDisplay');
        const vendorTypeDisplay = document.getElementById('vendorTypeDisplay');
        const statusDisplay = document.getElementById('statusDisplay');
        const businessDetailsDisplay = document.getElementById('businessDetailsDisplay');
        const headerTitle = document.getElementById('headerTitle');

        async function initDashboard() {
            try {
                // Get current active session from Supabase Auth (handled via magic link redirect)
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();
                
                if (sessionError || !session) {
                    window.location.href = 'login.html';
                    return;
                }

                const userEmail = session.user.email;

                // Query the vendors table for this email
                const { data: vendorData, error: vendorError } = await supabase
                    .from('vendors')
                    .select('*')
                    .eq('email', userEmail)
                    .single();

                if (vendorError || !vendorData) {
                    loadingState.style.display = 'none';
                    errorState.style.display = 'block';
                    return;
                }

                // Populate dashboard details
                headerTitle.textContent = `Welcome, ${vendorData.first_name}`;
                vendorIdDisplay.textContent = vendorData.id;
                vendorTypeDisplay.textContent = vendorData.vendor_type;
                businessDetailsDisplay.textContent = vendorData.business_details;

                statusDisplay.textContent = vendorData.status;
                if (vendorData.status === 'APPROVED') {
                    statusDisplay.className = 'status-badge status-approved';
                } else {
                    statusDisplay.className = 'status-badge status-pending';
                }

                loadingState.style.display = 'none';
                dashboardContent.style.display = 'block';

            } catch (err) {
                console.error('Dashboard load error:', err);
                loadingState.style.display = 'none';
                errorState.style.display = 'block';
            }
        }

        // Handle Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'portal.html';
        });

        initDashboard();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo Hub - Buyer Registration</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(135deg, #f5f7fa 0%, #e8f0f8 100%);
  background-attachment: fixed;
  min-height: 100vh;
  padding: 20px;
  animation: backgroundFade 0.8s ease-out;
}
@keyframes backgroundFade {
  from { opacity: 0; }
  to { opacity: 1; }
}
.container {
  max-width: 800px;
  margin: 40px auto;
  background: white;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(30, 90, 168, 0.08);
  overflow: hidden;
  animation: containerSlideIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes containerSlideIn {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
header {
  background: linear-gradient(135deg, #1e5aa8 0%, #2e7bb4 100%);
  color: white;
  padding: 30px;
  text-align: center;
}
header h1 {
  font-size: 2.5em;
  margin-bottom: 5px;
}
header p {
  font-size: 1.1em;
  opacity: 0.95;
  margin: 0;
}
.content {
  padding: 40px;
}
.section h2 {
  color: #1e5aa8;
  margin-bottom: 25px;
  font-size: 1.6em;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
}
.form-group {
  margin-bottom: 22px;
}
label {
  display: block;
  margin-bottom: 8px;
  color: #2c3e50;
  font-weight: 600;
  font-size: 0.95em;
  letter-spacing: 0.3px;
}
input[type="text"],
input[type="email"],
input[type="password"],
textarea,
select {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid #e1e8ed;
  border-radius: 10px;
  font-family: inherit;
  font-size: 15px;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  background: white;
  color: #2c3e50;
}
input[type="file"] {
  padding: 10px 0;
  color: #2c3e50;
}
input::placeholder, textarea::placeholder {
  color: #a0aec0;
}
input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: #1e5aa8;
  background: #f8fbff;
  box-shadow: 0 0 0 3px rgba(30, 90, 168, 0.08), inset 0 0 0 1px rgba(30, 90, 168, 0.04);
  transform: translateY(-2px);
}
.password-wrapper {
  position: relative;
}
.password-toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: #1e5aa8;
  font-size: 18px;
  padding: 5px;
}
.checkbox-group {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 8px;
  background: #fafbfc;
  padding: 16px;
  border: 2px solid #e1e8ed;
  border-radius: 10px;
}
.checkbox-label {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: normal;
  color: #2c3e50;
  cursor: pointer;
}
.checkbox-label input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: #1e5aa8;
  cursor: pointer;
}
button[type="submit"] {
  background: linear-gradient(135deg, #1e5aa8 0%, #2e7bb4 100%);
  color: white;
  padding: 14px 32px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  width: 100%;
  margin-top: 10px;
}
button[type="submit"]:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 24px rgba(30, 90, 168, 0.25);
}
button[type="submit"]:disabled {
  opacity: 0.7;
  cursor: not-allowed;
  transform: none;
}
.error {
  color: #c0392b;
  background: #fadbd8;
  padding: 16px;
  border-radius: 10px;
  margin-bottom: 20px;
  display: none;
  border-left: 4px solid #c0392b;
  font-weight: 500;
  font-size: 14px;
}
.success {
  color: #27ae60;
  background: #d5f4e6;
  padding: 16px;
  border-radius: 10px;
  margin-bottom: 20px;
  display: none;
  border-left: 4px solid #27ae60;
  font-weight: 500;
  font-size: 14px;
}
.login-link {
  text-align: center;
  margin-top: 20px;
  font-size: 0.9em;
  color: #64748b;
}
.login-link a {
  color: #1e5aa8;
  text-decoration: none;
  font-weight: 600;
}
.login-link a:hover {
  text-decoration: underline;
}
@media (max-width: 600px) {
  .checkbox-group {
    grid-template-columns: 1fr;
  }
  .content {
    padding: 20px;
  }
}
</style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Echo Hub</h1>
            <p>Buyer Registration Portal</p>
        </header>
        <div class="content">
            <div class="section">
                <h2>Create Your Buyer Account</h2>
                <div class="error" id="buyerError"></div>
                <div class="success" id="buyerSuccess"></div>
                <form id="buyerForm">
                    <div class="form-group">
                        <label for="fullName">Full Name <span style="color: #c0392b;">*</span></label>
                        <input type="text" id="fullName" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address <span style="color: #c0392b;">*</span></label>
                        <input type="email" id="email" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Create Password <span style="color: #c0392b;">*</span></label>
                        <div class="password-wrapper">
                            <input type="password" id="password" placeholder="At least 6 characters" required minlength="6">
                            <button type="button" class="password-toggle" id="togglePassword">Show</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="whatsapp">WhatsApp Number (Optional)</label>
                        <input type="text" id="whatsapp" placeholder="e.g., +18765555555">
                    </div>
                    <div class="form-group">
                        <label>Categories of Interest <span style="color: #c0392b;">*</span></label>
                        <div class="checkbox-group">
                            <label class="checkbox-label"><input type="checkbox" name="category" value="Wigs"> Wigs</label>
                            <label class="checkbox-label"><input type="checkbox" name="category" value="Toys"> Toys</label>
                            <label class="checkbox-label"><input type="checkbox" name="category" value="Gadgets"> Gadgets</label>
                            <label class="checkbox-label"><input type="checkbox" name="category" value="Clothing"> Clothing</label>
                            <label class="checkbox-label"><input type="checkbox" name="category" value="Office Furniture"> Office Furniture</label>
                            <label class="checkbox-label"><input type="checkbox" name="category" value="All"> All (including future products)</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="nationalIdFile">Upload Your National ID <span style="color: #c0392b;">*</span> (Mandatory)</label>
                        <input type="file" id="nationalIdFile" required>
                    </div>
                    <button type="submit">Register Account</button>
                </form>
                <div class="login-link">
                    Already have an account? <a href="login.html">Sign in here</a>
                </div>
            </div>
        </div>
    </div>
    <script>
        const SUPABASE_URL = 'https://nvtqtkllmsiqknogmarc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ju4wLLra1DBXDyGiHGOB7w_TdsjcBj1';
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        let referredBy = null;
        try {
            const urlParams = new URLSearchParams(window.location.search);
            referredBy = urlParams.get('ref');
        } catch (err) {
            console.log('Query param parse note:', err);
        }

        // Web Crypto API password hashing using PBKDF2
        async function hashPassword(password) {
            try {
                // Generate random salt
                const salt = crypto.getRandomValues(new Uint8Array(16));

                // Encode password
                const encoder = new TextEncoder();
                const data = encoder.encode(password);

                // Import key
                const key = await crypto.subtle.importKey(
                    'raw',
                    data,
                    'PBKDF2',
                    false,
                    ['deriveBits']
                );

                // Derive bits
                const bits = await crypto.subtle.deriveBits(
                    {
                        name: 'PBKDF2',
                        salt: salt,
                        iterations: 100000,
                        hash: 'SHA-256'
                    },
                    key,
                    256
                );

                // Combine salt and hash
                const hashArray = new Uint8Array(bits);
                const combined = new Uint8Array(salt.length + hashArray.length);
                combined.set(salt, 0);
                combined.set(hashArray, salt.length);

                // Return as base64
                return btoa(String.fromCharCode(...combined));
            } catch (err) {
                console.error('[PASSWORD_HASH_ERROR]', err);
                throw new Error('Password hashing failed');
            }
        }

        // Password toggle functionality
        const passwordInput = document.getElementById('password');
        const toggleButton = document.getElementById('togglePassword');
        toggleButton.addEventListener('click', (e) => {
            e.preventDefault();
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            toggleButton.textContent = type === 'password' ? 'Show' : 'Hide';
        });

        document.getElementById('buyerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('buyerError');
            const successDiv = document.getElementById('buyerSuccess');
            const submitBtn = e.target.querySelector('button[type="submit"]');
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const whatsapp = document.getElementById('whatsapp').value.trim();
            const fileInput = document.getElementById('nationalIdFile').files[0];

            const selectedCategories = Array.from(document.querySelectorAll('input[name="category"]:checked'))
                .map(cb => cb.value);

            if (selectedCategories.length === 0) {
                errorDiv.textContent = 'Please select at least one category of interest.';
                errorDiv.style.display = 'block';
                return;
            }

            if (!fileInput) {
                errorDiv.textContent = 'Please upload your National ID document.';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                if (!supabaseClient) throw new Error('Supabase client failed to initialize.');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Registering...';

                // Hash password with Web Crypto API
                console.log('[SECURITY] Hashing password with Web Crypto API');
                const hashedPassword = await hashPassword(password);

                // Convert file to Base64
                const arrayBuffer = await fileInput.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);
                let base64Data = '';
                const chunkSize = 8192;
                for (let i = 0; i < uint8Array.length; i += chunkSize) {
                    const chunk = uint8Array.subarray(i, i + chunkSize);
                    base64Data += String.fromCharCode.apply(null, Array.from(chunk));
                }
                base64Data = btoa(base64Data);

                const fileExt = fileInput.name.split('.').pop() || 'bin';
                const mimeType = fileInput.type || 'application/octet-stream';
                console.log('[BASE64] Converting file to Base64:', fileInput.name);

                // Generate referral code
                const refCode = 'REF-' + Math.random().toString(36).substring(2, 8).toUpperCase();

                // Insert buyer record to buyers table
                console.log('[DB] Inserting buyer record');
                const { data, error } = await supabaseClient.from('buyers').insert([{
                    full_name: fullName,
                    email: email,
                    password: hashedPassword,
                    whatsapp_number: whatsapp || null,
                    categories_interest: selectedCategories,
                    referred_by: referredBy || null,
                    referral_code: refCode,
                    national_id_data: base64Data,
                    national_id_file_name: fileInput.name,
                    national_id_file_type: mimeType,
                    national_id_file_size: uint8Array.length,
                    approval_status: 'PENDING'
                }]).select();

                if (error) {
                    console.error('[DB_ERROR]', error);
                    throw new Error(`Database insert failed: ${error.message}`);
                }

                console.log('[SUCCESS] Buyer registration complete');
                console.log('[INFO] Referral Code:', refCode);
                successDiv.textContent = '✅ Registration successful! Your national ID will be reviewed by our team. You will be notified via email once your account is verified. You can sign in once approved.';
                successDiv.style.display = 'block';
                document.getElementById('buyerForm').reset();
                submitBtn.textContent = 'Register Account';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);
            } catch (err) {
                console.error('[ERROR]', err);
                errorDiv.textContent = 'Error during registration: ' + err.message;
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register Account';
            }
        });
    </script>
</body>
</html>

<script>
        const SUPABASE_URL = 'https://pueffzvcnonfyjftloto.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_IMUxKFnuQIQP2XmfXhc6zQ_HVYZSKZS';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadCategories() {
            const { data, error } = await db.from('products').select('category, subcategory');
            const filterContainer = document.getElementById('category-filters');
            
            if (error) {
                console.error('Error loading categories:', error.message);
                return;
            }

            const taxonomy = {};
            if (data && data.length > 0) {
                data.forEach(item => {
                    const cat = item.category ? item.category.trim() : null;
                    const sub = item.subcategory ? item.subcategory.trim() : null;
                    if (!cat) return;
                    
                    if (!taxonomy[cat]) {
                        taxonomy[cat] = new Set();
                    }
                    if (sub) {
                        taxonomy[cat].add(sub);
                    }
                });
            }

            let html = `<button class="filter-link active" onclick="filterCategory('All', null, this)">All Categories</button>`;
            
            for (const [cat, subs] of Object.entries(taxonomy)) {
                html += `
                    <div class="category-group" style="margin-top: 10px;">
                        <button class="filter-link" style="font-weight: 600;" onclick="filterCategory('${cat}', null, this)">${cat}</button>
                `;
                
                if (subs.size > 0) {
                    html += `<div class="subcategories" style="margin-left: 12px; display: flex; flex-direction: column; gap: 4px; margin-top: 4px;">`;
                    subs.forEach(sub => {
                        html += `<button class="filter-link" style="font-size: 13px; padding: 6px 10px;" onclick="filterCategory('${cat}', '${sub}', this)">↳ ${sub}</button>`;
                    });
                    html += `</div>`;
                }
                html += `</div>`;
            }
            
            filterContainer.innerHTML = html;
        }

        async function loadProducts(category = 'All', subcategory = null) {
            let query = db.from('products').select('*');
            
            if (category !== 'All') {
                query = query.eq('category', category);
            }
            if (subcategory) {
                query = query.eq('subcategory', subcategory);
            }

            const { data, error } = await query;
            const container = document.getElementById('products-container');
            
            if (error) {
                console.error('Error loading products:', error.message);
                container.innerHTML = '<p style="color: #e74c3c;">Failed to load products.</p>';
                return;
            }

            if (data && data.length > 0) {
                container.innerHTML = data.map(product => `
                    <div class="product-box">
                        <div>
                            ${product.image_url_1 ? `<img src="${product.image_url_1}" alt="${product.name}" style="width: 100%; height: 160px; object-fit: cover; border-radius: 8px; margin-bottom: 12px;">` : ''}
                            <span style="font-size: 11px; color: #718096; text-transform: uppercase; font-weight: 600;">Vendor: ${product.vendor_id || 'Echo Hub'}</span>
                            <h5 style="margin-top: 4px;">${product.name}</h5>
                            <div class="cost">$${parseFloat(product.price).toFixed(2)}</div>
                        </div>
                        <button onclick="alert('Inquiring about ${product.name}')">Inquire</button>
                    </div>
                `).join('');
            } else {
                container.innerHTML = '<p style="color: #666; grid-column: 1 / -1; text-align: center; padding: 40px;">No products found in this selection.</p>';
            }
        }

        function filterCategory(category, subcategory, buttonElement) {
            document.querySelectorAll('.filter-link').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            loadProducts(category, subcategory);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await loadCategories();
            await loadProducts('All', null);
        });
    </script>

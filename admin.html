<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Admin Approval Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        body { background: #f5f7fa; min-height: 100vh; color: #2c3e50; }
        header { background: #1e5aa8; color: white; padding: 25px 30px; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #e1e8ed; font-size: 14px; }
        th { background: #f8fafc; color: #1e5aa8; font-weight: 700; text-transform: uppercase; }
        .btn { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .btn-invite { background: #2ecc71; color: white; }
        .id-link { color: #1e5aa8; text-decoration: none; font-weight: 600; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; background: #fef3c7; color: #d97706; }
    </style>
</head>
<body>
    <header>
        <h1>Echo Hub Admin</h1>
        <p>Buyer Registration Approval Portal</p>
    </header>

    <div class="container">
        <div class="card">
            <h3>Pending Registrations</h3>
            <div id="admin-content"><p>Loading...</p></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pueffzvcnonfyjftloto.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_IMUxKFnuQIQP2XmfXhc6zQ_HVYZSKZS';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchPendingRegistrations() {
            const { data, error } = await db.from('buyers').select('*').ilike('ready_to_invite', 'pending');
            const container = document.getElementById('admin-content');

            if (error) {
                container.innerHTML = `<p style="color: red;">Database Error: ${error.message}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = '<p>No pending registrations.</p>';
                return;
            }

            let html = `<table><thead><tr><th>Name / Email</th><th>ID Document</th><th>WhatsApp</th><th>Status</th><th>Actions</th></tr></thead><tbody>`;

            for (const buyer of data) {
                let idDisplayHtml = '<span style="color: gray;">No file</span>';
                
                if (buyer.national_id_url) {
                    let rawPath = buyer.national_id_url;
                    console.log("Processing raw database path for buyer:", rawPath);
                    
                    // Extract exact filename safely
                    let filename = rawPath.split('/').pop();
                    let cleanStoragePath = `ids/${filename}`;

                    // Directly test public URL generation to guarantee output
                    const { data: publicUrlData } = db.storage
                        .from('national-ids')
                        .getPublicUrl(cleanStoragePath);

                    if (publicUrlData && publicUrlData.publicUrl) {
                        console.log("Successfully generated link:", publicUrlData.publicUrl);
                        idDisplayHtml = `<a href="${publicUrlData.publicUrl}" target="_blank" class="id-link">View ID File</a>`;
                    } else {
                        idDisplayHtml = `<span style="color: red;">Path Generation Failed</span>`;
                    }
                }
                
                html += `
                    <tr id="row-${buyer.id}">
                        <td><strong>${buyer.full_name}</strong><br><small>${buyer.email}</small></td>
                        <td>${idDisplayHtml}</td>
                        <td>${buyer.whatsapp_number || 'N/A'}</td>
                        <td><span class="status-badge">${buyer.ready_to_invite}</span></td>
                        <td><button class="btn btn-invite" onclick="updateInviteStatus('${buyer.id}')">Mark Ready</button></td>
                    </tr>`;
            }

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        async function updateInviteStatus(buyerId) {
            await db.from('buyers').update({ ready_to_invite: 'Ready To Invite' }).eq('id', buyerId);
            document.getElementById(`row-${buyerId}`).remove();
        }

        window.addEventListener('DOMContentLoaded', fetchPendingRegistrations);
    </script>
</body>
</html>

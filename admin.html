<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Buyer Management Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #f5f7fa 0%, #e8f0f8 100%) !important;
            background-attachment: fixed !important;
            min-height: 100vh;
            color: #2c3e50; 
        }
        header {
            background: linear-gradient(135deg, #1e5aa8 0%, #2e7bb4 100%) !important;
            color: white !important;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(30, 90, 168, 0.1);
            margin-bottom: 30px;
        }
        header h1 { font-size: 2.2em; margin-bottom: 5px; font-weight: 700; color: white !important; }
        header p { font-size: 1.05em; opacity: 0.95; margin: 0; color: white !important; }
        .hub-card {
            background: #ffffff !important;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(30, 90, 168, 0.05);
        }
    </style>
</head>
<body class="p-6">

    <header>
        <h1>Echo Hub</h1>
        <p>Buyer Registration & Access Management Portal</p>
    </header>

    <!-- Main Container -->
    <div class="max-w-6xl mx-auto hub-card p-6">
        <div class="flex justify-between items-center mb-6 border-b pb-3">
            <h2 class="text-xl font-bold text-[#1e5aa8]">Buyer Access Requests</h2>
            <span id="buyer-count" class="text-sm bg-blue-100 text-[#1e5aa8] px-3 py-1 rounded-full font-semibold">0 buyers</span>
        </div>
        
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                        <th class="p-3">Buyer Details</th>
                        <th class="p-3">ID Verification</th>
                        <th class="p-3">Status</th>
                        <th class="p-3 text-center">Action Control</th>
                    </tr>
                </thead>
                <tbody id="buyers-table-body" class="divide-y divide-gray-100 text-sm">
                    <tr>
                        <td colspan="4" class="p-4 text-center text-gray-500">Loading buyer registrations...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let db;
        const SUPABASE_URL = 'https://pueffzvcnonfyjftloto.supabase.co';

        window.addEventListener('DOMContentLoaded', async () => {
            if (window.supabase) {
                const SUPABASE_ANON_KEY = 'sb_publishable_IMUxKFnuQIQP2XmfXhc6zQ_HVYZSKZS';
                db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                loadBuyersPortal();
            } else {
                console.error("Supabase library failed to load.");
                document.getElementById('buyers-table-body').innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">Error: Supabase library failed to load.</td></tr>`;
            }
        });

        async function loadBuyersPortal() {
            const tableBody = document.getElementById('buyers-table-body');
            if (!tableBody) return;
            
            const { data, error } = await db.from('buyers').select('*').order('created_at', { ascending: false });

            if (error) {
                tableBody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">Error loading buyers: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-500">No buyer registrations found.</td></tr>`;
                document.getElementById('buyer-count').textContent = '0 buyers';
                return;
            }

            document.getElementById('buyer-count').textContent = `${data.length} buyer${data.length === 1 ? '' : 's'}`;

            tableBody.innerHTML = data.map(buyer => {
                let statusBadge = '';
                let actionButton = '';

                // Normalize database value: trim spaces and convert to uppercase for safe comparison
                const rawStatus = (buyer.ready_to_invite || '').trim().toUpperCase();

                if (rawStatus === 'READY' || rawStatus === 'READY TO INVITE' || rawStatus === 'APPROVED') {
                    statusBadge = '<span class="bg-green-100 text-green-700 px-2.5 py-1 rounded-full text-xs font-semibold">APPROVED</span>';
                    actionButton = `<button onclick="updateBuyerStatus('${buyer.id}', '${escapeHtml(buyer.email)}', 'BLOCKED')" class="bg-red-100 text-red-600 hover:bg-red-600 hover:text-white px-3 py-1 rounded text-xs font-semibold transition">Block Access</button>`;
                } else if (rawStatus === 'BLOCKED') {
                    statusBadge = '<span class="bg-red-100 text-red-700 px-2.5 py-1 rounded-full text-xs font-semibold">BLOCKED</span>';
                    actionButton = `<button onclick="updateBuyerStatus('${buyer.id}', '${escapeHtml(buyer.email)}', 'Ready To Invite')" class="bg-green-100 text-green-700 hover:bg-green-600 hover:text-white px-3 py-1 rounded text-xs font-semibold transition">Approve</button>`;
                } else {
                    statusBadge = '<span class="bg-amber-100 text-amber-700 px-2.5 py-1 rounded-full text-xs font-semibold">PENDING</span>';
                    actionButton = `<button onclick="updateBuyerStatus('${buyer.id}', '${escapeHtml(buyer.email)}', 'Ready To Invite')" class="bg-blue-100 text-[#1e5aa8] hover:bg-[#1e5aa8] hover:text-white px-3 py-1 rounded text-xs font-semibold transition">Mark Ready</button>`;
                }

                // ID link resolution handling both 'ids/' and 'national-ids/' prefix variations safely
                let idCellContent = '<span class="text-gray-400 text-xs">No ID</span>';
                if (buyer.national_id_url) {
                    const rawVal = buyer.national_id_url.trim();
                    if (rawVal.startsWith('http')) {
                        idCellContent = `
                            <div><a href="${rawVal}" target="_blank" class="text-[#1e5aa8] underline text-xs font-medium">View ID File</a></div>
                            <div class="text-[10px] text-gray-400 truncate max-w-xs mt-0.5">${escapeHtml(rawVal)}</div>
                        `;
                    } else if (rawVal.includes('/')) {
                        let cleanPath = rawVal;
                        if (cleanPath.startsWith('national-ids/')) {
                            cleanPath = cleanPath.replace('national-ids/', '');
                        }
                        
                        const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/national-ids/${cleanPath}`;
                        
                        idCellContent = `
                            <div><a href="${publicUrl}" target="_blank" class="text-[#1e5aa8] underline text-xs font-medium">View ID File</a></div>
                            <div class="text-[10px] text-gray-400 truncate max-w-xs mt-0.5">Path: ${escapeHtml(cleanPath)}</div>
                        `;
                    } else {
                        idCellContent = `<span class="text-gray-400 text-xs">${escapeHtml(rawVal)}</span>`;
                    }
                }

                return `
                    <tr class="hover:bg-gray-50/50 transition border-b">
                        <td class="p-3">
                            <div class="font-medium text-gray-800">${escapeHtml(buyer.full_name || 'Unknown')}</div>
                            <div class="text-xs text-gray-500">${escapeHtml(buyer.email)}</div>
                            <div class="text-xs text-gray-400">${escapeHtml(buyer.whatsapp_number || buyer.phone || '')}</div>
                        </td>
                        <td class="p-3">
                            ${idCellContent}
                        </td>
                        <td class="p-3">${statusBadge}</td>
                        <td class="p-3 text-center">${actionButton}</td>
                    </tr>
                `;
            }).join('');
        }

        async function updateBuyerStatus(buyerId, buyerEmail, newStatus) {
            const actionLabel = newStatus.includes('Ready') || newStatus === 'READY' ? 'approve' : 'block';
            if (!confirm(`Are you sure you want to ${actionLabel} access for ${buyerEmail}?`)) {
                return;
            }

            const { error } = await db.from('buyers')
                .update({ ready_to_invite: newStatus })
                .eq('id', buyerId);

            if (error) {
                alert('Error updating buyer status: ' + error.message);
                return;
            }

            if (newStatus.includes('Ready') || newStatus === 'READY') {
                console.log(`[Email Relay] Sending Welcome / Approval email to: ${buyerEmail}`);
                alert(`Buyer approved successfully! Welcome email triggered for ${buyerEmail}.`);
            } else {
                console.log(`[Email Relay] Sending Marketplace Suspension notice to: ${buyerEmail}`);
                alert(`Buyer access blocked. Suspension notice triggered for ${buyerEmail}.`);
            }

            loadBuyersPortal();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>

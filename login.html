<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Vendor Portal & Authentication</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8f0f8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #2c3e50;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(30, 90, 168, 0.08);
            overflow: hidden;
            padding: 40px;
        }

        h2 {
            color: #1e5aa8;
            font-size: 1.8em;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.95em;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85em;
            font-weight: 600;
            color: #475569;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            color: #1e293b;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #1e5aa8;
            background: #f8fafc;
        }

        .btn-submit {
            width: 100%;
            background: #1e5aa8;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #174887;
        }

        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .alert-msg {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.85em;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #dcfce7;
            color: #15803d;
        }

        .alert-error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .toggle-mode {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9em;
            color: #64748b;
        }

        .toggle-mode a {
            color: #1e5aa8;
            text-decoration: none;
            font-weight: 600;
        }

        .toggle-mode a:hover {
            text-decoration: underline;
        }

        .row-fields {
            display: flex;
            gap: 12px;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div id="formHeader">
            <h2 id="formTitle">Vendor Login</h2>
            <p class="subtitle" id="formSubtitle">Access your Echo Hub marketplace dashboard</p>
        </div>

        <div id="authAlert" class="alert-msg"></div>

        <form id="authForm">
            <!-- Extra Registration Fields (Hidden by default) -->
            <div id="registerFields" style="display: none;">
                <div class="row-fields">
                    <div class="form-group" style="flex: 1;">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" placeholder="India">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" placeholder="Stronghold">
                    </div>
                </div>
                <div class="form-group">
                    <label for="vendorType">Vendor Classification</label>
                    <input type="text" id="vendorType" value="UPFRONT" placeholder="UPFRONT">
                </div>
            </div>

            <div class="form-group">
                <label for="email">Account Email</label>
                <input type="email" id="email" required placeholder="vendor@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
        </form>

        <div class="toggle-mode">
            <span id="toggleText">New vendor?</span> 
            <a href="#" id="toggleBtn">Create an account</a>
        </div>
    </div>

    <script>
        console.log("Login script initializing...");

        const SUPABASE_URL = 'https://pueffzvcnonfyjftloto.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_IMUxKFnuQIQP2XmfXhc6zQ_HVYZSKZS';
        
        let supabaseClient = null;
        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                console.log("Supabase client initialized successfully.");
            } else {
                console.error("window.supabase is not available. SDK failed to load.");
            }
        } catch (err) {
            console.error("Error creating Supabase client:", err);
        }

        let isRegisterMode = false;

        const authForm = document.getElementById('authForm');
        const formTitle = document.getElementById('formTitle');
        const formSubtitle = document.getElementById('formSubtitle');
        const submitBtn = document.getElementById('submitBtn');
        const toggleBtn = document.getElementById('toggleBtn');
        const toggleText = document.getElementById('toggleText');
        const registerFields = document.getElementById('registerFields');
        const authAlert = document.getElementById('authAlert');

        // Toggle between Login and Registration views
        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isRegisterMode = !isRegisterMode;
            showAlert('', false);

            if (isRegisterMode) {
                formTitle.textContent = 'Vendor Registration';
                formSubtitle.textContent = 'Set up your Echo Hub marketplace account';
                submitBtn.textContent = 'Complete Registration';
                registerFields.style.display = 'block';
                toggleText.textContent = 'Already have an account?';
                toggleBtn.textContent = 'Sign in';
            } else {
                formTitle.textContent = 'Vendor Login';
                formSubtitle.textContent = 'Access your Echo Hub marketplace dashboard';
                submitBtn.textContent = 'Sign In';
                registerFields.style.display = 'none';
                toggleText.textContent = 'New vendor?';
                toggleBtn.textContent = 'Create an account';
            }
        });

        // Handle Form Submission (Login or Register)
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            showAlert('', false);
            submitBtn.disabled = true;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                if (!supabaseClient) throw new Error('Supabase client failed to initialize properly.');

                if (isRegisterMode) {
                    const firstName = document.getElementById('firstName').value.trim() || 'Vendor';
                    const lastName = document.getElementById('lastName').value.trim() || 'Partner';
                    const vendorType = document.getElementById('vendorType').value.trim() || 'UPFRONT';

                    submitBtn.textContent = 'Creating account...';

                    const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                        email,
                        password,
                        options: { data: { first_name: firstName, last_name: lastName } }
                    });

                    if (authError) throw new Error(authError.message);
                    if (!authData.user) throw new Error('Registration failed to return user session.');

                    const authUuid = authData.user.id;

                    const { count, error: countError } = await supabaseClient
                        .from('vendors')
                        .select('*', { count: 'exact', head: true });

                    if (countError) throw new Error('Could not calculate vendor sequence.');

                    const nextNum = (count || 0) + 1;
                    const formattedId = `${firstName}-${lastName}-${String(nextNum).padStart(5, '0')}`;

                    const { error: insertError } = await supabaseClient.from('vendors').insert([
                        {
                            id: formattedId,
                            user_id: authUuid,
                            email: email,
                            first_name: firstName,
                            last_name: lastName,
                            vendor_type: vendorType,
                            status: 'ACTIVE',
                            created_at: new Date()
                        }
                    ]);

                    if (insertError) throw new Error('Profile creation error: ' + insertError.message);

                    showAlert('Registration successful! Redirecting to dashboard...', false);
                    setTimeout(() => { window.location.href = 'manage.html'; }, 1000);

                } else {
                    submitBtn.textContent = 'Signing in...';

                    const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                        email,
                        password
                    });

                    if (authError) throw new Error(authError.message);
                    const authUser = authData.user;

                    const { data: vendorData, error: vendorError } = await supabaseClient
                        .from('vendors')
                        .select('*')
                        .eq('user_id', authUser.id)
                        .single();

                    if (vendorError || !vendorData) {
                        throw new Error('User profile record not found in vendors table.');
                    }

                    window.location.href = 'manage.html';
                }

            } catch (err) {
                console.error("Authentication error caught:", err);
                showAlert(err.message, true);
                submitBtn.disabled = false;
                submitBtn.textContent = isRegisterMode ? 'Complete Registration' : 'Sign In';
            }
        });

        function showAlert(msg, isError) {
            if (!msg) {
                authAlert.style.display = 'none';
                return;
            }
            authAlert.textContent = msg;
            authAlert.className = 'alert-msg ' + (isError ? 'alert-error' : 'alert-success');
            authAlert.style.display = 'block';
        }
    </script>
</body>
</html>

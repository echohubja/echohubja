<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Admin Approval Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        body { 
            background: linear-gradient(135deg, #f5f7fa 0%, #e8f0f8 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #2c3e50; 
        }
        header {
            background: linear-gradient(135deg, #1e5aa8 0%, #2e7bb4 100%);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(30, 90, 168, 0.1);
        }
        header h1 { font-size: 1.8em; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(30, 90, 168, 0.05);
            margin-bottom: 20px;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #e1e8ed; font-size: 14px; }
        th { background: #f8fafc; color: #1e5aa8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        tr:hover { background: #fdfefe; }
        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: opacity 0.2s ease;
        }
        .btn-invite { background: #2ecc71; color: white; }
        .btn:hover { opacity: 0.85; }
        .id-link { color: #1e5aa8; text-decoration: none; font-weight: 600; }
        .id-link:hover { text-decoration: underline; }
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-ready { background: #fef3c7; color: #d97706; }
    </style>
</head>
<body>
    <header>
        <h1>Echo Hub Admin</h1>
        <p>Buyer Registration Approval Portal</p>
    </header>

    <div class="container">
        <div class="card">
            <h3 style="color: #1e5aa8; margin-bottom: 15px; font-size: 16px; text-transform: uppercase; letter-spacing: 1px;">Pending Registrations</h3>
            <div id="admin-content">
                <p style="color: #666;">Loading pending registrations...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pueffzvcnonfyjftloto.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_IMUxKFnuQIQP2XmfXhc6zQ_HVYZSKZS';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchPendingRegistrations() {
            const { data, error } = await db
                .from('buyers')
                .select('*')
                .ilike('ready_to_invite', 'pending');

            const container = document.getElementById('admin-content');

            if (error) {
                console.error('Error fetching registrations:', error.message);
                container.innerHTML = `<p style="color: #e74c3c;">Error loading records: ${error.message}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = '<p style="color: #666; text-align: center; padding: 30px;">No buyer registrations pending approval.</p>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Name / Email</th>
                            <th>ID Document</th>
                            <th>WhatsApp</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach(buyer => {
                let idDisplayHtml = '<span style="color: #a0aec0;">No file uploaded</span>';
                
                if (buyer.national_id_url) {
                    let rawPath = buyer.national_id_url;
                    
                    if (rawPath === 'legacy_import') {
                        idDisplayHtml = '<span style="color: #d97706; font-weight: 600;">Legacy Import</span>';
                    } else {
                        // Map the path to use the correct 'national-ids' bucket name
                        let correctedPath = rawPath.startsWith('ids/') 
                            ? rawPath.replace('ids/', 'national-ids/') 
                            : rawPath;

                        let fullIdUrl = correctedPath.startsWith('http') 
                            ? correctedPath 
                            : `${SUPABASE_URL}/storage/v1/object/public/${correctedPath}`;
                        
                        idDisplayHtml = `<a href="${fullIdUrl}" target="_blank" class="id-link">View ID File</a>`;
                    }
                }
                
                html += `
                    <tr id="row-${buyer.id}">
                        <td>
                            <strong>${buyer.full_name || 'N/A'}</strong><br>
                            <span style="color: #718096; font-size: 12px;">${buyer.email || 'N/A'}</span>
                        </td>
                        <td>
                            ${idDisplayHtml}
                        </td>
                        <td>
                            <span style="color: #4a5568; font-size: 13px;">${buyer.whatsapp_number || 'N/A'}</span>
                        </td>
                        <td>
                            <span class="status-badge status-ready">${buyer.ready_to_invite}</span>
                        </td>
                        <td>
                            <button class="btn btn-invite" onclick="updateInviteStatus('${buyer.id}', 'Ready To Invite')">Mark Ready To Invite</button>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        async function updateInviteStatus(buyerId, newState) {
            const { error } = await db
                .from('buyers')
                .update({ ready_to_invite: newState })
                .eq('id', buyerId);

            if (error) {
                alert('Failed to update status: ' + error.message);
                return;
            }

            const row = document.getElementById(`row-${buyerId}`);
            if (row) {
                row.remove();
            }

            const tbody = document.querySelector('tbody');
            if (tbody && tbody.children.length === 0) {
                fetchPendingRegistrations();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchPendingRegistrations();
        });
    </script>
</body>
</html>

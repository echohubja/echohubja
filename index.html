<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Marketplace</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        body { 
            background: linear-gradient(135deg, #f5f7fa 0%, #e8f0f8 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #2c3e50; 
        }
        header {
            background: linear-gradient(135deg, #1e5aa8 0%, #2e7bb4 100%);
            color: white;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(30, 90, 168, 0.1);
        }
        .header-left h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
        }
        .header-left p {
            font-size: 1.1em;
            opacity: 0.95;
            margin: 0;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .buyer-pill {
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            align-items: center;
        }
        .btn-portal {
            background: white;
            color: #1e5aa8;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(0, 0, 10, 0.1);
            transition: all 0.2s ease;
        }
        .btn-portal:hover {
            background: #f8fbff;
            transform: translateY(-1px);
        }
        .layout { 
            max-width: 1400px; 
            margin: 40px auto; 
            padding: 0 20px; 
            display: grid; 
            grid-template-columns: 240px 1fr; 
            gap: 40px; 
        }
        aside {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(30, 90, 168, 0.05);
            height: fit-content;
        }
        .filter-group h3 { 
            font-size: 14px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            color: #1e5aa8; 
            margin-bottom: 15px; 
            font-weight: 700;
        }
        .filter-links { display: flex; flex-direction: column; gap: 8px; }
        .filter-link { 
            background: none; 
            border: none; 
            text-align: left; 
            padding: 10px 12px; 
            border-radius: 8px;
            font-size: 15px; 
            color: #4a5568; 
            cursor: pointer; 
            transition: all 0.2s ease;
            width: 100%;
        }
        .filter-link:hover, .filter-link.active { 
            background: #f0f4f8;
            color: #1e5aa8; 
            font-weight: 600; 
        }
        .content-area { display: flex; flex-direction: column; gap: 20px; }

        /* Compact Aesthetic Referral Hub & Stats Widget Styling */
        .referral-hub-widget {
            background: #ffffff;
            border: 1px solid #e1e8ed;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(30, 90, 168, 0.05);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .referral-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .referral-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            color: #1e5aa8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .split-badge {
            background: #e6fffa;
            color: #234e52;
            border: 1px solid #b2f5ea;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
        }
        .referral-link-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .referral-link-box input {
            flex-grow: 1;
            background: #f8fafc;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            font-family: monospace;
            color: #4a5568;
        }
        .btn-copy {
            background: #1e5aa8;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s ease;
            white-space: nowrap;
        }
        .btn-copy:hover { background: #164685; }
        .referral-stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .stat-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .stat-card .label {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .stat-card .value {
            font-size: 18px;
            font-weight: 800;
            color: #2c3e50;
        }
        .stat-referrals .label { color: #3182ce; }
        .stat-pending .label { color: #d69e2e; }
        .stat-paid .label { color: #38a169; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }
        .product-box { 
            background: #fff; 
            border: 2px solid #e1e8ed; 
            border-radius: 12px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            box-shadow: 0 10px 30px rgba(30, 90, 168, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .product-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(30, 90, 168, 0.1);
        }
        .product-box h5 { font-size: 16px; margin-bottom: 8px; font-weight: 600; color: #2c3e50; }
        .product-box .cost { font-size: 18px; color: #1e5aa8; margin-bottom: 15px; font-weight: 700; }
        .product-box button { 
            background: linear-gradient(135deg, #1e5aa8 0%, #2e7bb4 100%); 
            color: #fff; 
            border: none; 
            padding: 10px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600;
            transition: opacity 0.2s ease;
        }
        .product-box button:hover { opacity: 0.9; }

        /* Modal styling */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 15px;
        }
        .modal-content h3 { color: #1e5aa8; margin-bottom: 5px; }
        .routing-info {
            background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px 12px; border-radius: 8px; font-size: 13px; color: #4a5568; display: flex; flex-direction: column; gap: 4px;
        }
        .modal-content textarea {
            width: 100%; height: 90px; padding: 10px; border: 1px solid #cbd5e0; border-radius: 8px; resize: vertical; font-size: 14px;
        }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 5px; }
        .modal-buttons button { padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; border: none; }
        .btn-cancel { background: #e2e8f0; color: #4a5568; }
        .btn-submit { background: #1e5aa8; color: white; }

        @media (max-width: 768px) {
            .layout { grid-template-columns: 1fr; }
            header { flex-direction: column; gap: 15px; text-align: center; }
            .referral-stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <h1>Echo Hub</h1>
            <p>Marketplace Storefront</p>
        </div>
        <div class="header-right">
            <div id="buyer-pill" class="buyer-pill">
                Active Buyer: <span id="current-buyer-name" style="margin-left: 5px; font-weight: 600;"></span>
                <button onclick="logoutBuyer()" style="background: none; border: none; color: white; text-decoration: underline; cursor: pointer; font-size: 13px; margin-left: 10px; font-weight: 600;">Sign Out</button>
            </div>
            <a href="portal.html" class="btn-portal" id="portal-btn">Sign In / Account Portal</a>
        </div>
    </header>

    <div class="layout">
        <aside>
            <div class="filter-group">
                <h3>Catalog Sections</h3>
                <div class="filter-links" id="category-filters">
                    <button class="filter-link active" onclick="filterCategory('All', this)">All Categories</button>
                </div>
            </div>
        </aside>
        
        <main class="content-area">
            <!-- Compact Aesthetic Referral Hub & Stats Widget -->
            <div class="referral-hub-widget" id="referral-widget-container">
                <div class="referral-top">
                    <div class="referral-title">
                        <span>🤝</span> Your Referral Hub & Stats
                    </div>
                    <div class="split-badge">20% Net Split Active</div>
                </div>
                <div class="referral-link-box">
                    <input type="text" id="user-referral-link" readonly value="Loading referral link...">
                    <button class="btn-copy" onclick="copyReferralLink()">Copy Link</button>
                </div>
                <div class="referral-stats-grid">
                    <div class="stat-card stat-referrals">
                        <div class="label">Total Referrals</div>
                        <div class="value" id="stat-total-referrals">0</div>
                    </div>
                    <div class="stat-card stat-pending">
                        <div class="label">Pending Balance</div>
                        <div class="value" id="stat-pending-balance">$0.00</div>
                    </div>
                    <div class="stat-card stat-paid">
                        <div class="label">Total Paid Out</div>
                        <div class="value" id="stat-total-paid">$0.00</div>
                    </div>
                </div>
            </div>

            <div class="products-grid" id="products-container">
                <!-- Dynamic products load here -->
            </div>
        </main>
    </div>

    <!-- Inquiry Modal -->
    <div class="modal-overlay" id="inquiry-modal">
        <div class="modal-content">
            <h3>Product Inquiry</h3>
            <p id="modal-product-title" style="font-weight: 600; color: #2c3e50; font-size: 15px;"></p>
            
            <!-- Routing Details Box -->
            <div class="routing-info">
                <div><strong>From (Buyer ID):</strong> <span id="modal-buyer-id-display"></span></div>
                <div><strong>To (Vendor ID):</strong> <span id="modal-vendor-id-display"></span></div>
            </div>

            <input type="hidden" id="modal-product-id">
            <input type="hidden" id="modal-vendor-id">
            
            <div>
                <label style="font-size: 13px; color: #4a5568; display: block; margin-bottom: 5px;">Your Message / Question:</label>
                <textarea id="inquiry-message" placeholder="Ask details about this product..."></textarea>
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeInquiryModal()">Cancel</button>
                <button class="btn-submit" onclick="submitInquiry()">Send Inquiry</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pueffzvcnonfyjftloto.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_IMUxKFnuQIQP2XmfXhc6zQ_HVYZSKZS';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentBuyerId = ''; // Holds the UUID for database foreign key relation
        let currentBuyerStringId = ''; // Holds the 'BUYER-XXXXX' string for UI display
        let currentActiveEmail = '';

        async function checkBuyerSession() {
            const buyerPill = document.getElementById('buyer-pill');
            const buyerNameSpan = document.getElementById('current-buyer-name');
            const portalBtn = document.getElementById('portal-btn');

            const { data: { session } } = await db.auth.getSession();
            currentActiveEmail = session?.user?.email || localStorage.getItem('echo_hub_buyer_email') || localStorage.getItem('buyer_email') || localStorage.getItem('user_email');

            if (currentActiveEmail) {
                buyerPill.style.display = 'flex';
                portalBtn.style.display = 'none';

                // Query all possible name variations from the buyers table
                const { data: buyerData, error } = await db
                    .from('buyers')
                    .select('id, buyer_id, name, full_name, username')
                    .eq('email', currentActiveEmail)
                    .single();

                // DEBUG LOG: Check your browser console (F12) to see what Supabase actually returned
                console.log("Supabase Buyer Data Result:", buyerData, error);

                if (buyerData) {
                    currentBuyerId = buyerData.id; 
                    currentBuyerStringId = buyerData.buyer_id || 'BUYER-00000';
                    
                    const buyerName = buyerData.name || buyerData.full_name || buyerData.username;
                    
                    buyerNameSpan.textContent = buyerName ? `${buyerName} (${currentActiveEmail})` : currentActiveEmail;
                } else {
                    currentBuyerId = '';
                    currentBuyerStringId = 'BUYER-00000';
                    buyerNameSpan.textContent = currentActiveEmail;
                }

                updateReferralWidget(currentBuyerStringId);
            } else {
                buyerPill.style.display = 'none';
                portalBtn.style.display = 'inline-block';
                currentBuyerId = '';
                currentBuyerStringId = '';
                updateReferralWidget('GUEST');
            }
        }

        function updateReferralWidget(refCode) {
            const linkInput = document.getElementById('user-referral-link');
            if (linkInput) {
                const baseUrl = window.location.origin + window.location.pathname;
                linkInput.value = `${baseUrl}?ref=${refCode}`;
            }
        }

        function copyReferralLink() {
            const linkInput = document.getElementById('user-referral-link');
            linkInput.select();
            linkInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(linkInput.value);
            alert('Referral link copied to clipboard!');
        }

        async function logoutBuyer() {
            await db.auth.signOut();
            localStorage.removeItem('echo_hub_buyer_email');
            localStorage.removeItem('buyer_email');
            localStorage.removeItem('user_email');
            window.location.reload();
        }

        async function loadCategories() {
            const { data, error } = await db.from('products').select('category');
            const filterContainer = document.getElementById('category-filters');
            
            if (error) {
                console.error('Error loading categories:', error.message);
                return;
            }

            const taxonomy = {};
            if (data && data.length > 0) {
                data.forEach(item => {
                    if (item.category) {
                        const rawCat = item.category.trim();
                        const parts = rawCat.split('>').map(p => p.trim());
                        const mainCat = parts[0];
                        
                        if (!taxonomy[mainCat]) {
                            taxonomy[mainCat] = {};
                        }
                        
                        if (parts.length > 1) {
                            const subCat = parts[1];
                            taxonomy[mainCat][subCat] = rawCat;
                        }
                    }
                });
            }

            let html = `<button class="filter-link active" onclick="filterCategory('All', this)">All Categories</button>`;
            
            for (const [mainCat, subs] of Object.entries(taxonomy)) {
                html += `
                    <div class="category-group" style="margin-top: 10px;">
                        <button class="filter-link" style="font-weight: 600;" onclick="filterCategory('${mainCat}', this, true)">${mainCat}</button>
                `;
                
                const subKeys = Object.keys(subs);
                if (subKeys.length > 0) {
                    html += `<div class="subcategories" style="margin-left: 12px; display: flex; flex-direction: column; gap: 4px; margin-top: 4px;">`;
                    subKeys.forEach(subCat => {
                        const exactDbString = subs[subCat];
                        html += `<button class="filter-link" style="font-size: 13px; padding: 6px 10px;" onclick="filterCategory('${exactDbString}', this, false)">↳ ${subCat}</button>`;
                    });
                    html += `</div>`;
                }
                html += `</div>`;
            }
            
            filterContainer.innerHTML = html;
        }

        async function loadProducts(categoryQuery = 'All', isMainGroup = false) {
            let query = db.from('products').select('*');
            
            if (categoryQuery !== 'All') {
                if (isMainGroup) {
                    query = query.ilike('category', `${categoryQuery}%`);
                } else {
                    query = query.eq('category', categoryQuery);
                }
            }

            const { data, error } = await query;
            const container = document.getElementById('products-container');
            
            if (error) {
                console.error('Error loading products:', error.message);
                container.innerHTML = '<p style="color: #e74c3c;">Failed to load products.</p>';
                return;
            }

            if (data && data.length > 0) {
                container.innerHTML = data.map(product => `
                    <div class="product-box">
                        <div>
                            ${product.image_url_1 ? `<img src="${product.image_url_1}" alt="${product.name}" style="width: 100%; height: 160px; object-fit: contain; background-color: #f8fafc; border-radius: 8px; margin-bottom: 12px;">` : ''}
                            <span style="font-size: 11px; color: #718096; text-transform: uppercase; font-weight: 600;">Vendor: ${product.vendor_id || 'Echo Hub'}</span>
                            <h5 style="margin-top: 4px;">${product.name}</h5>
                            <div class="cost">$${parseFloat(product.price).toFixed(2)}</div>
                        </div>
                        <button onclick="openInquiryModal('${product.id}', '${product.name.replace(/'/g, "\\'")}', '${product.vendor_id || 'Echo Hub'}')">Inquire</button>
                    </div>
                `).join('');
            } else {
                container.innerHTML = '<p style="color: #666; grid-column: 1 / -1; text-align: center; padding: 40px;">No products found in this selection.</p>';
            }
        }

        function filterCategory(categoryQuery, buttonElement, isMainGroup = false) {
            document.querySelectorAll('.filter-link').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            loadProducts(categoryQuery, isMainGroup);
        }

        function openInquiryModal(productId, productName, vendorId) {
            if (!currentActiveEmail) {
                alert('Please sign in through the account portal before sending a product inquiry.');
                window.location.href = 'portal.html';
                return;
            }
            document.getElementById('modal-product-id').value = productId;
            document.getElementById('modal-vendor-id').value = vendorId;
            document.getElementById('modal-product-title').textContent = productName;
            
            document.getElementById('modal-buyer-id-display').textContent = currentBuyerStringId;
            document.getElementById('modal-vendor-id-display').textContent = vendorId;

            document.getElementById('inquiry-message').value = '';
            document.getElementById('inquiry-modal').style.display = 'flex';
        }

        function closeInquiryModal() {
            document.getElementById('inquiry-modal').style.display = 'none';
        }

        async function submitInquiry() {
            const productId = document.getElementById('modal-product-id').value;
            const vendorId = document.getElementById('modal-vendor-id').value;
            const message = document.getElementById('inquiry-message').value.trim();

            if (!message) {
                alert('Please enter a message for your inquiry.');
                return;
            }

            const { error } = await db.from('inquiries').insert([
                {
                    product_id: productId,
                    vendor_id: vendorId === 'Echo Hub' ? null : vendorId,
                    buyer_id: currentBuyerId, 
                    message: message
                }
            ]);

            if (error) {
                console.error('Error submitting inquiry:', error.message);
                alert('Failed to send inquiry. Please try again.');
                return;
            }

            alert('Inquiry sent successfully!');
            closeInquiryModal();
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await checkBuyerSession();
            await loadCategories();
            await loadProducts('All');
        });
    </script>
</body>
</html>

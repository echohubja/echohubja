<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Vendor Onboarding Portal</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8f0f8 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: backgroundFade 0.8s ease-out;
        }

        @keyframes backgroundFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(30, 90, 168, 0.08);
            overflow: hidden;
            animation: containerSlideIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes containerSlideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            background: linear-gradient(135deg, #1e5aa8 0%, #2e7bb4 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.95;
            margin: 0;
        }

        .content {
            padding: 40px;
        }

        .section h2 {
            color: #1e5aa8;
            margin-bottom: 25px;
            font-size: 1.6em;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 600;
            font-size: 0.95em;
            letter-spacing: 0.3px;
        }

        label .required {
            color: #c0392b;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        textarea,
        select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            background: white;
            color: #2c3e50;
        }

        input::placeholder, textarea::placeholder {
            color: #a0aec0;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #1e5aa8;
            background: #f8fbff;
            box-shadow: 0 0 0 3px rgba(30, 90, 168, 0.08), inset 0 0 0 1px rgba(30, 90, 168, 0.04);
            transform: translateY(-2px);
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            font-weight: normal;
            color: #2c3e50;
            cursor: pointer;
            font-size: 14px;
            background: #fafbfc;
            padding: 12px 16px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .radio-label:hover {
            background-color: #f8fbff;
            border-color: #1e5aa8;
        }

        .radio-label input {
            margin-right: 12px;
            accent-color: #1e5aa8;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn-submit {
            background: linear-gradient(135deg, #1e5aa8 0%, #2e7bb4 100%);
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 100%;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(30, 90, 168, 0.25);
        }

        .btn-submit:active {
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error {
            color: #c0392b;
            background: #fadbd8;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #c0392b;
            font-weight: 500;
            font-size: 14px;
        }

        .success {
            color: #27ae60;
            background: #d5f4e6;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #27ae60;
            font-weight: 500;
            font-size: 14px;
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #1e5aa8;
            font-size: 18px;
            padding: 5px;
        }

        @media (max-width: 600px) {
            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Echo Hub</h1>
            <p>Vendor Onboarding Portal</p>
        </header>

        <div class="content">
            <div class="section">
                <h2>🤝 Vendor Registration</h2>

                <div id="successAlert" class="success">
                    <strong>Registration Successful!</strong> Your vendor account has been created. Our team will review your information shortly.
                </div>

                <div id="errorAlert" class="error">
                    <strong>Submission Failed:</strong> <span id="errorMessage">Please check your inputs and try again.</span>
                </div>

                <form id="vendorForm">
                    <div class="form-group">
                        <label>Are you an UPFRONT or REFUND AFTER REVIEW vendor? <span class="required">*</span></label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="vendor_type" value="UPFRONT" required>
                                <div><strong>UPFRONT</strong></div>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="vendor_type" value="REFUND_AFTER_REVIEW" required>
                                <div><strong>REFUND AFTER REVIEW</strong></div>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="firstName">First Name <span class="required">*</span></label>
                        <input type="text" id="firstName" name="firstName" required placeholder="Enter your first name">
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name <span class="required">*</span></label>
                        <input type="text" id="lastName" name="lastName" required placeholder="Enter your last name">
                    </div>

                    <div class="form-group">
                        <label for="email">PayPal Email Address (For Payouts) <span class="required">*</span></label>
                        <input type="email" id="email" name="email" required placeholder="your-paypal@email.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Account Password <span class="required">*</span></label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" required minlength="6" placeholder="At least 6 characters">
                            <button type="button" class="password-toggle" id="togglePassword">Show</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="businessDetails">List the product types that you will offer <span class="required">*</span></label>
                        <textarea id="businessDetails" name="businessDetails" rows="3" required placeholder="e.g., Electronics, Clothing, Home Goods, Services, etc."></textarea>
                    </div>

                    <button type="submit" id="submitBtn" class="btn-submit">Register as Vendor</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Initialize Supabase Client safely
        const SUPABASE_URL = 'https://nvtqtkllmsiqknogmarc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ju4wLLra1DBXDyGiHGOB7w_TdsjcBj1';
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        // Password toggle functionality
        const passwordInput = document.getElementById('password');
        const toggleButton = document.getElementById('togglePassword');
        toggleButton.addEventListener('click', (e) => {
            e.preventDefault();
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            toggleButton.textContent = type === 'password' ? 'Show' : 'Hide';
        });

        const form = document.getElementById('vendorForm');
        const submitBtn = document.getElementById('submitBtn');
        const successAlert = document.getElementById('successAlert');
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            successAlert.style.display = 'none';
            errorAlert.style.display = 'none';

            if (!supabaseClient) {
                errorMessage.textContent = 'Supabase client failed to initialize.';
                errorAlert.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Registering...';

            const vendorType = document.querySelector('input[name="vendor_type"]:checked').value;
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const businessDetails = document.getElementById('businessDetails').value.trim();

            try {
                // Insert vendor record directly to database
                console.log('[DB] Inserting vendor record');
                console.log('[DB] Full data collected:', {
                    vendor_type: vendorType,
                    first_name: firstName,
                    last_name: lastName,
                    email: email,
                    password: password ? '(provided)' : '(empty)',
                    business_details: businessDetails
                });

                const vendorRecord = {
                    vendor_type: vendorType,
                    first_name: firstName,
                    last_name: lastName,
                    email: email,
                    password: password,
                    business_details: businessDetails
                };

                const { data, error } = await supabaseClient.from('vendors').insert([vendorRecord]).select();

                if (error) {
                    console.error('[DB_ERROR]', error);
                    throw new Error(`Database insert failed: ${error.message}`);
                }

                console.log('[SUCCESS] Vendor registration complete');
                console.log('[SUCCESS] Vendor ID:', data?.[0]?.id);

                successAlert.style.display = 'block';
                form.reset();
                window.scrollTo({ top: 0, behavior: 'smooth' });

            } catch (err) {
                console.error('[ERROR]', err);
                errorMessage.textContent = 'Error during registration: ' + err.message;
                errorAlert.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register as Vendor';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Account Portal & Authentication</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8f0f8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #2c3e50;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(30, 90, 168, 0.08);
            overflow: hidden;
            padding: 40px;
        }

        h2 {
            color: #1e5aa8;
            font-size: 1.8em;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.95em;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85em;
            font-weight: 600;
            color: #475569;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            color: #1e293b;
            background: #fff;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1e5aa8;
            background: #f8fafc;
        }

        .btn-submit {
            width: 100%;
            background: #1e5aa8;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #174887;
        }

        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .alert-msg {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.85em;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #dcfce7;
            color: #15803d;
        }

        .alert-error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .toggle-mode {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9em;
            color: #64748b;
        }

        .toggle-mode a {
            color: #1e5aa8;
            text-decoration: none;
            font-weight: 600;
        }

        .toggle-mode a:hover {
            text-decoration: underline;
        }

        .row-fields {
            display: flex;
            gap: 12px;
        }

        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            color: #1e293b;
            background: #fff;
            transition: border-color 0.2s;
            resize: vertical;
            min-height: 100px;
        }

        textarea:focus {
            outline: none;
            border-color: #1e5aa8;
            background: #f8fafc;
        }

        input[type="radio"] {
            width: auto;
            margin: 0;
            cursor: pointer;
        }

        small {
            color: #64748b;
            font-size: 0.8em;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div id="formHeader">
            <h2 id="formTitle">Account Login</h2>
            <p class="subtitle" id="formSubtitle">Access your Echo Hub marketplace account or dashboard</p>
        </div>

        <div id="authAlert" class="alert-msg"></div>

        <form id="authForm">
            <!-- Extra Registration Fields (Hidden by default) -->
            <div id="registerFields" style="display: none;">
                <div class="form-group">
                    <label for="accountType">I want to register as a:</label>
                    <select id="accountType">
                        <option value="buyer">Buyer / Reviewer</option>
                        <option value="vendor">Vendor Partner</option>
                    </select>
                </div>

                <div class="row-fields">
                    <div class="form-group" style="flex: 1;">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" placeholder="India">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" placeholder="Stronghold">
                    </div>
                </div>

                <div id="vendorSpecificFields" style="display: none;">
                    <div class="form-group">
                        <label>Vendor Type</label>
                        <div style="display: flex; gap: 20px; margin-top: 8px;">
                            <label style="margin: 0; font-weight: normal; display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="radio" name="vendorType" value="UPFRONT" checked> UPFRONT
                            </label>
                            <label style="margin: 0; font-weight: normal; display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="radio" name="vendorType" value="REFUND_AFTER_REVIEW"> REFUND_AFTER_REVIEW
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="commissionAmount">Commission Amount (USD) <span style="color: #e74c3c;">*</span></label>
                        <input type="number" id="commissionAmount" placeholder="5.00" min="5" step="0.01" required>
                        <small style="color: #64748b; margin-top: 4px; display: block;">Minimum: $5.00 USD</small>
                    </div>

                    <div class="form-group">
                        <label for="businessDetails">What will you be interested in offering?</label>
                        <textarea id="businessDetails" placeholder="Describe your business and services..." style="width: 100%; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 14px; color: #1e293b; resize: vertical; min-height: 100px;"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="referralCodeVendor">Referral Code (Optional)</label>
                        <input type="text" id="referralCodeVendor" placeholder="Enter referral code if you have one">
                    </div>

                    <div class="form-group">
                        <label for="paypalEmailVendor">PayPal Email <span style="color: #e74c3c;">*</span></label>
                        <input type="email" id="paypalEmailVendor" placeholder="your.paypal@email.com" required>
                    </div>
                    <div id="paypalErrorVendor" class="alert-msg alert-error" style="display: none; margin-bottom: 15px;"></div>
                </div>

                <div id="buyerSpecificFields" style="display: none;">
                    <div class="form-group">
                        <label for="whatsappNumber">WhatsApp Number</label>
                        <input type="tel" id="whatsappNumber" name="whatsappNumber" placeholder="+1234567890">
                    </div>

                    <div class="form-group">
                        <label for="categoriesInterest">Categories of Interest</label>
                        <input type="text" id="categoriesInterest" name="categoriesInterest" placeholder="e.g., Electronics, Fashion, Food">
                    </div>

                    <div class="form-group">
                        <label for="nationalIdFile">National ID File</label>
                        <input type="file" id="nationalIdFile" name="nationalIdFile" accept=".pdf,.jpg,.jpeg,.png">
                    </div>

                    <div class="form-group">
                        <label for="paypalEmail">PayPal Email</label>
                        <input type="email" id="paypalEmail" name="paypalEmail" placeholder="your.paypal@email.com">
                    </div>
                    <div id="paypalError" class="alert-msg alert-error" style="display: none; margin-bottom: 15px;"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Account Email</label>
                <input type="email" id="email" required placeholder="name@example.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
        </form>

        <div class="toggle-mode">
            <span id="toggleText">New to Echo Hub?</span> 
            <a href="#" id="toggleBtn">Create an account</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nvtqtkllmsiqknogmarc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ju4wLLra1DBXDyGiHGOB7w_TdsjcBj1';
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        let isRegisterMode = false;

        const authForm = document.getElementById('authForm');
        const formTitle = document.getElementById('formTitle');
        const formSubtitle = document.getElementById('formSubtitle');
        const submitBtn = document.getElementById('submitBtn');
        const toggleBtn = document.getElementById('toggleBtn');
        const toggleText = document.getElementById('toggleText');
        const registerFields = document.getElementById('registerFields');
        const accountTypeSelect = document.getElementById('accountType');
        const vendorSpecificFields = document.getElementById('vendorSpecificFields');
        const buyerSpecificFields = document.getElementById('buyerSpecificFields');
        const authAlert = document.getElementById('authAlert');

        // Handle logout request from index.html
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('logout') === 'true') {
            localStorage.removeItem('buyer_id');
            localStorage.removeItem('buyer_email');
            localStorage.removeItem('vendor_id');
            localStorage.removeItem('vendor_email');
            localStorage.removeItem('user_email');
            if (supabaseClient) {
                supabaseClient.auth.signOut();
            }
        }

        // Toggle visibility of role-specific inputs based on selection
        // ATTACH BEFORE auto-registration so the change event listener is ready
        accountTypeSelect.addEventListener('change', (e) => {
            if (e.target.value === 'vendor') {
                vendorSpecificFields.style.display = 'block';
                buyerSpecificFields.style.display = 'none';
            } else {
                vendorSpecificFields.style.display = 'none';
                buyerSpecificFields.style.display = 'block';
            }
        });

        // Check URL parameters for auto-registration mode
        const registerType = urlParams.get('register'); // 'buyer' or 'vendor'
        if (registerType === 'buyer' || registerType === 'vendor') {
            // Auto-toggle to registration mode
            isRegisterMode = true;
            formTitle.textContent = 'Create Account';
            formSubtitle.textContent = 'Set up your Echo Hub marketplace account';
            submitBtn.textContent = 'Complete Registration';
            registerFields.style.display = 'block';
            toggleText.textContent = 'Already have an account?';
            toggleBtn.textContent = 'Sign in';

            // Auto-select account type (listener now ready to handle this)
            accountTypeSelect.value = registerType;
            accountTypeSelect.dispatchEvent(new Event('change'));

            // Clear URL to avoid confusion
            window.history.replaceState({}, document.title, 'login.html');
        }

        // Clear PayPal error when user types
        document.getElementById('paypalEmail').addEventListener('input', () => {
            document.getElementById('paypalError').style.display = 'none';
        });

        // Clear Vendor PayPal error when user types
        document.getElementById('paypalEmailVendor').addEventListener('input', () => {
            document.getElementById('paypalErrorVendor').style.display = 'none';
        });

        // Toggle between Login and Registration views
        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isRegisterMode = !isRegisterMode;
            showAlert('', false);
            document.getElementById('paypalError').style.display = 'none';
            document.getElementById('paypalErrorVendor').style.display = 'none';

            if (isRegisterMode) {
                formTitle.textContent = 'Create Account';
                formSubtitle.textContent = 'Set up your Echo Hub marketplace account';
                submitBtn.textContent = 'Complete Registration';
                registerFields.style.display = 'block';
                toggleText.textContent = 'Already have an account?';
                toggleBtn.textContent = 'Sign in';
            } else {
                formTitle.textContent = 'Account Login';
                formSubtitle.textContent = 'Access your Echo Hub marketplace account or dashboard';
                submitBtn.textContent = 'Sign In';
                registerFields.style.display = 'none';
                toggleText.textContent = 'New to Echo Hub?';
                toggleBtn.textContent = 'Create an account';
            }
        });

        // Handle Form Submission (Login or Register)
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            showAlert('', false);
            submitBtn.disabled = true;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                if (!supabaseClient) throw new Error('Supabase client failed to initialize.');

                if (isRegisterMode) {
                    // --- REGISTRATION FLOW ---
                    const accountType = accountTypeSelect.value;
                    const firstName = document.getElementById('firstName').value.trim() || (accountType === 'vendor' ? 'Vendor' : 'Buyer');
                    const lastName = document.getElementById('lastName').value.trim() || 'Partner';

                    submitBtn.textContent = 'Creating account...';

                    // 1. Create Supabase Auth User
                    const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                        email,
                        password,
                        options: { data: { first_name: firstName, last_name: lastName, role: accountType } }
                    });

                    if (authError) throw new Error(authError.message);
                    if (!authData.user) throw new Error('Registration failed to return user session.');

                    const authUuid = authData.user.id;

                    if (accountType === 'vendor') {
                        // Vendor Registration Path
                        const vendorType = document.querySelector('input[name="vendorType"]:checked').value;
                        const commissionAmount = parseFloat(document.getElementById('commissionAmount').value);
                        const businessDetails = document.getElementById('businessDetails').value.trim();
                        const referralCode = document.getElementById('referralCodeVendor').value.trim() || null;
                        const paypalEmail = document.getElementById('paypalEmailVendor').value.trim();

                        // Validate commission amount
                        if (isNaN(commissionAmount) || commissionAmount < 5.00) {
                            throw new Error('Commission amount must be at least $5.00 USD.');
                        }

                        // Validate PayPal Email
                        if (!paypalEmail) {
                            document.getElementById('paypalErrorVendor').textContent = 'PayPal Email is required.';
                            document.getElementById('paypalErrorVendor').style.display = 'block';
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Complete Registration';
                            throw new Error('PayPal Email is required for vendor registration.');
                        }

                        const { error: insertError } = await supabaseClient.from('vendors').insert([
                            {
                                id: authUuid,
                                user_id: authUuid,
                                email: email,
                                business_name: firstName + ' ' + lastName,
                                description: businessDetails,
                                current_per_feedback_rate: commissionAmount,
                                paypal_email: paypalEmail,
                                suspension_status: 'active',
                                accumulated_balance: 0,
                                rating: 0,
                                created_at: new Date().toISOString()
                            }
                        ]);

                        if (insertError) throw new Error('Vendor profile creation error: ' + insertError.message);

                        localStorage.setItem('vendor_id', authUuid);
                        localStorage.setItem('vendor_email', email);
                        if (referralCode) localStorage.setItem('vendor_referral_code', referralCode);

                        showAlert('Registration successful! Redirecting to dashboard...', false);
                        setTimeout(() => { window.location.href = 'manage.html'; }, 1000);

                    } else {
                        // Buyer Registration Path (creates referral code & profile)
                        const refCode = 'REF-' + Math.random().toString(36).substring(2, 8).toUpperCase();
                        const paypalEmail = document.getElementById('paypalEmail').value.trim();
                        const whatsappNumber = document.getElementById('whatsappNumber').value.trim();
                        const categoriesInterest = document.getElementById('categoriesInterest').value.trim();
                        const nationalIdFile = document.getElementById('nationalIdFile').files[0];

                        if (!paypalEmail) {
                            document.getElementById('paypalError').textContent = 'PayPal Email is required.';
                            document.getElementById('paypalError').style.display = 'block';
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Complete Registration';
                            throw new Error('PayPal Email is required for buyer registration.');
                        }

                        let nationalIdData = null;
                        let nationalIdFileName = null;
                        let nationalIdFileType = null;
                        let nationalIdFileSize = null;

                        if (nationalIdFile) {
                            nationalIdFileName = nationalIdFile.name;
                            nationalIdFileType = nationalIdFile.type;
                            nationalIdFileSize = nationalIdFile.size;
                            const reader = new FileReader();
                            nationalIdData = await new Promise((resolve, reject) => {
                                reader.onload = () => resolve(reader.result);
                                reader.onerror = reject;
                                reader.readAsDataURL(nationalIdFile);
                            });
                        }

                        const { error: insertError } = await supabaseClient.from('buyers').insert([
                            {
                                id: authUuid,
                                user_id: authUuid,
                                email: email,
                                full_name: firstName + ' ' + lastName,
                                paypal_email: paypalEmail,
                                whatsapp_number: whatsappNumber || null,
                                categories_interest: categoriesInterest || null,
                                national_id_data: nationalIdData,
                                national_id_file_name: nationalIdFileName,
                                national_id_file_type: nationalIdFileType,
                                national_id_file_size: nationalIdFileSize,
                                referral_code: refCode,
                                approval_status: 'approved',
                                accumulated_balance: 0,
                                created_at: new Date(),
                                updated_at: new Date()
                            }
                        ]);

                        if (insertError) throw new Error('Buyer profile creation error: ' + insertError.message);

                        localStorage.setItem('buyer_id', authUuid);
                        localStorage.setItem('buyer_email', email);

                        showAlert('Registration successful! Redirecting to storefront...', false);
                        setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                    }

                } else {
                    // --- LOGIN FLOW (Supabase Auth only) ---
                    submitBtn.textContent = 'Signing in...';

                    // 1. Authenticate via Supabase Auth
                    const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                        email,
                        password
                    });

                    if (authError) throw new Error(authError.message);
                    const authUser = authData.user;

                    // 2. Check if user is a Vendor
                    const { data: vendorData } = await supabaseClient
                        .from('vendors')
                        .select('id, email')
                        .eq('user_id', authUser.id)
                        .maybeSingle();

                    if (vendorData) {
                        localStorage.setItem('vendor_id', vendorData.id);
                        localStorage.setItem('vendor_email', vendorData.email);
                        window.location.href = 'manage.html';
                        return;
                    }

                    // 3. Check if user is a Buyer
                    const { data: buyerData } = await supabaseClient
                        .from('buyers')
                        .select('id, email, approval_status')
                        .eq('user_id', authUser.id)
                        .maybeSingle();

                    if (buyerData) {
                        // Check approval status
                        if (buyerData.approval_status?.toLowerCase() !== 'approved') {
                            throw new Error(`Your account is ${buyerData.approval_status}. You will receive access once your national ID is verified.`);
                        }
                        localStorage.setItem('buyer_id', buyerData.id);
                        localStorage.setItem('buyer_email', buyerData.email);
                        window.location.href = 'index.html';
                        return;
                    }

                    // Fallback: No vendor or buyer profile found
                    throw new Error('Account authenticated but no vendor or buyer profile found.');
                }

            } catch (err) {
                showAlert(err.message, true);
                submitBtn.disabled = false;
                submitBtn.textContent = isRegisterMode ? 'Complete Registration' : 'Sign In';
            }
        });

        function showAlert(msg, isError) {
            if (!msg) {
                authAlert.style.display = 'none';
                return;
            }
            authAlert.textContent = msg;
            authAlert.className = 'alert-msg ' + (isError ? 'alert-error' : 'alert-success');
            authAlert.style.display = 'block';
        }
    </script>
</body>
</html>

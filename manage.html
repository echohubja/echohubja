<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Vendor Product Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6">

    <div class="max-w-xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h2 id="form-title" class="text-2xl font-bold mb-6 text-gray-800">Create New Product Listing</h2>
        
        <form id="product-form" onsubmit="handleFormSubmit(event)">
            <input type="hidden" id="product-id">

            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Vendor ID</label>
                <input type="text" id="vendor-id" required placeholder="e.g. Roxroy-Brown-00001" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Product Name</label>
                <input type="text" id="product-name" required placeholder="e.g. Wireless Earbuds" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Category</label>
                <input type="text" id="product-category" required placeholder="e.g. Electronics" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Price ($)</label>
                <input type="number" step="0.01" id="product-price" required placeholder="29.99" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Primary Image URL (.jpg, .png)</label>
                <input type="url" id="image-url-1" required placeholder="https://example.com/image1.jpg" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 font-medium mb-2">Secondary Image URL (Optional)</label>
                <input type="url" id="image-url-2" placeholder="https://example.com/image2.jpg" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500">
            </div>

            <div class="flex gap-4">
                <button type="submit" id="submit-btn" class="flex-1 bg-black text-white py-2 px-4 rounded hover:bg-gray-800 transition">Publish Listing</button>
                <button type="button" onclick="resetForm()" class="bg-gray-200 text-gray-700 py-2 px-4 rounded hover:bg-gray-300 transition">Cancel</button>
            </div>
        </form>

        <div class="mt-8 border-t pt-6">
            <h3 class="text-lg font-semibold mb-3 text-gray-800">Select Existing Product to Edit</h3>
            <div class="flex gap-2">
                <select id="product-select" class="flex-1 border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500">
                    <option value="">-- Choose a product --</option>
                </select>
                <button type="button" onclick="loadSelectedProduct()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Load</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pueffzvcnonfyjftloto.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_IMUxKFnuQIQP2XmfXhc6zQ_HVYZSKZS';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function populateProductDropdown() {
            const selectElement = document.getElementById('product-select');
            selectElement.innerHTML = '<option value="">-- Choose a product --</option>';
            const { data, error } = await db.from('products').select('id, name');

            if (!error && data) {
                data.forEach(product => {
                    const option = document.createElement('option');
                    option.value = product.id;
                    option.textContent = product.name;
                    selectElement.appendChild(option);
                });
            }
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            const productId = document.getElementById('product-id').value;
            const vendor_id = document.getElementById('vendor-id').value;
            const name = document.getElementById('product-name').value;
            const category = document.getElementById('product-category').value;
            const price = parseFloat(document.getElementById('product-price').value);
            const image_url_1 = document.getElementById('image-url-1').value;
            const image_url_2 = document.getElementById('image-url-2').value;

            if (productId) {
                const { error } = await db.from('products')
                    .update({ vendor_id, name, category, price, image_url_1, image_url_2 })
                    .eq('id', productId);
                if (error) alert('Error updating listing: ' + error.message);
                else {
                    alert('Listing successfully updated!');
                    window.location.href = 'index.html';
                }
            } else {
                const { error } = await db.from('products')
                    .insert([{ vendor_id, name, category, price, image_url_1, image_url_2 }]);
                if (error) alert('Error publishing listing: ' + error.message);
                else {
                    alert('Listing successfully published!');
                    window.location.href = 'index.html';
                }
            }
        }

        async function loadSelectedProduct() {
            const productId = document.getElementById('product-select').value;
            if (!productId) return alert('Please select a product first.');

            const { data, error } = await db.from('products').select('*').eq('id', productId).single();
            if (error || !data) return alert('Could not load product details.');

            document.getElementById('product-id').value = data.id;
            document.getElementById('vendor-id').value = data.vendor_id || '';
            document.getElementById('product-name').value = data.name || '';
            document.getElementById('product-category').value = data.category || '';
            document.getElementById('product-price').value = data.price || '';
            document.getElementById('image-url-1').value = data.image_url_1 || '';
            document.getElementById('image-url-2').value = data.image_url_2 || '';

            document.getElementById('form-title').innerText = `Edit Product: ${data.name}`;
            document.getElementById('submit-btn').innerText = 'Save Changes';
        }

        function resetForm() {
            document.getElementById('product-form').reset();
            document.getElementById('product-id').value = '';
            document.getElementById('form-title').innerText = 'Create New Product Listing';
            document.getElementById('submit-btn').innerText = 'Publish Listing';
        }

        window.addEventListener('DOMContentLoaded', populateProductDropdown);
    </script>
</body>
</html>

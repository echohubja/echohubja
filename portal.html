<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hub - Account Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8f0f8 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: backgroundFade 0.8s ease-out;
        }

        @keyframes backgroundFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(30, 90, 168, 0.08);
            overflow: hidden;
            animation: containerSlideIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes containerSlideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            background: linear-gradient(135deg, #1e5aa8 0%, #2e7bb4 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.2em;
            margin-bottom: 5px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 1.05em;
            opacity: 0.95;
            margin: 0;
        }

        .content {
            padding: 35px;
        }

        .portal-section {
            margin-bottom: 25px;
        }

        .portal-section h3 {
            color: #1e5aa8;
            font-size: 1.1em;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 12px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1e5aa8 0%, #2e7bb4 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(30, 90, 168, 0.15);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(30, 90, 168, 0.25);
        }

        .btn-secondary {
            background: #f8fbff;
            color: #1e5aa8;
            border: 2px solid #e1e8ed;
        }

        .btn-secondary:hover {
            background: #f1f5f9;
            border-color: #1e5aa8;
            transform: translateY(-2px);
        }

        .divider {
            border: none;
            border-top: 1px solid #e1e8ed;
            margin: 25px 0;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: #1e5aa8;
        }

        @media (max-width: 600px) {
            .content {
                padding: 25px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Echo Hub</h1>
            <p>Access Your Portal</p>
        </header>

        <div class="content">
            <div class="portal-section">
                <h3>🔐 Existing Users</h3>
                <a href="login.html" class="btn btn-primary">Sign In (Magic Link)</a>
            </div>

            <hr class="divider">

            <div class="portal-section">
                <h3>📋 New Account Registration</h3>
                <a href="vendor-register.html" class="btn btn-secondary">Register as Vendor</a>
                <a href="register.html" class="btn btn-secondary">Register as Buyer</a>
            </div>

            <div class="back-link">
                <a href="index.html">&larr; Back to Marketplace</a>
            </div>
        </div>
    </div>

</body>
</html>
